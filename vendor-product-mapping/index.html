<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Product Codes — Bigfoot Bites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/styles.css">
<style>
  [hidden] { display: none !important; }

  main { max-width: 960px; margin: 0 auto; padding: 1.5rem 1.25rem 5rem; }
  .breadcrumb { display: inline-block; font-size: 0.8rem; color: var(--ink-soft); text-decoration: none; margin-bottom: 0.6rem; }
  .breadcrumb:hover { color: var(--ledger-green); }
  .breadcrumb:focus-visible { outline: 2px solid var(--ledger-green); outline-offset: 2px; }
  header { margin-bottom: 1.5rem; border-bottom: 2px solid var(--ink); padding-bottom: 1rem; }
  h1 { font-family: 'Roboto Slab', serif; font-weight: 700; font-size: 1.6rem; margin: 0 0 0.25rem; letter-spacing: -0.01em; }
  .subtitle { color: var(--ink-soft); font-size: 0.9rem; }

  .chip-bar { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem; margin-bottom: 1rem; }
  .chip-bar::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.82rem;
    background: #fff; border: 1px solid var(--rule); border-radius: 999px;
    padding: 0.45rem 0.95rem; color: var(--ink-soft); cursor: pointer; white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--ledger-green); border-color: var(--ledger-green); color: #fff; }
  .chip:focus-visible { outline: 2px solid var(--ledger-green); outline-offset: 2px; }

  .panel { background: #fff; border: 1px solid var(--rule); border-radius: 6px; margin-bottom: 1.5rem; }
  .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 0.9rem 1.1rem; border-bottom: 1px solid var(--rule); gap: 1rem; flex-wrap: wrap; }
  .panel-header h2 { font-family: 'Roboto Slab', serif; font-size: 1rem; margin: 0; }

  button { font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 500; border-radius: 4px; border: 1px solid transparent; padding: 0.45rem 0.85rem; cursor: pointer; transition: opacity 0.15s ease; }
  button:hover { opacity: 0.85; }
  button:focus-visible { outline: 2px solid var(--ledger-green); outline-offset: 2px; }
  .btn-primary { background: var(--ledger-green); color: #fff; }
  .btn-quiet { background: transparent; color: var(--ink-soft); border-color: var(--rule); }
  .btn-danger { background: transparent; color: var(--danger, #B3492D); border-color: var(--danger-soft, #F5E4DE); }
  .btn-danger:hover { background: var(--danger-soft, #F5E4DE); }

  #add-form { display: none; padding: 1.1rem; gap: 0.75rem; grid-template-columns: 0.7fr 0.9fr 1.4fr 1.4fr 1.3fr 0.8fr auto; align-items: end; }
  #add-form.open { display: grid; }

  label { display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); margin-bottom: 0.3rem; }
  input, select { width: 100%; font-family: 'Inter', sans-serif; font-size: 0.9rem; padding: 0.5rem 0.55rem; border: 1px solid var(--rule); border-radius: 4px; background: #fff; color: var(--ink); }
  input:focus, select:focus { outline: 2px solid var(--ledger-green); outline-offset: 1px; }

  .upc-field { position: relative; }
  .upc-suggestions { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid var(--rule); border-top: none; border-radius: 0 0 4px 4px; max-height: 220px; overflow-y: auto; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
  .upc-suggestion { padding: 0.5rem 0.6rem; font-size: 0.85rem; cursor: pointer; border-bottom: 1px solid var(--rule); }
  .upc-suggestion:last-child { border-bottom: none; }
  .upc-suggestion:hover { background: var(--ledger-green-soft); }
  .upc-suggestion .sug-upc { color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; }

  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); padding: 0.6rem 1rem; border-bottom: 1px solid var(--rule); }
  tbody td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--rule); font-size: 0.92rem; vertical-align: middle; }
  td.code { font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; }
  .pill { display: inline-block; font-size: 0.72rem; padding: 0.15rem 0.5rem; border-radius: 20px; }
  .pill.matched { background: var(--ledger-green-soft); color: var(--ledger-green); }
  .pill.pending, .pill.unmatched { background: #F0EEE9; color: var(--inactive, #9A8F7D); }
  td.actions { text-align: right; white-space: nowrap; }
  td.actions button { margin-left: 0.4rem; }
  tr.editing td { background: var(--ledger-green-soft); }
  tr.editing input, tr.editing select { background: #fff; }

  .empty-state { padding: 3rem 1rem; text-align: center; color: var(--ink-soft); }
  .empty-state strong { display: block; color: var(--ink); margin-bottom: 0.35rem; font-family: 'Roboto Slab', serif; }
  #status-line { font-size: 0.82rem; color: var(--ink-soft); margin-top: 0.75rem; min-height: 1.2em; }
  #status-line.error { color: var(--danger, #B3492D); }

  @media (max-width: 800px) {
    #add-form.open { grid-template-columns: 1fr 1fr; }
    thead { display: none; }
    tbody tr { display: block; border-bottom: 2px solid var(--rule); }
    tbody td { display: flex; justify-content: space-between; border-bottom: none; padding: 0.5rem 1rem; gap: 1rem; }
    tbody td::before { content: attr(data-label); font-size: 0.72rem; text-transform: uppercase; color: var(--ink-soft); flex-shrink: 0; }
    td.actions { justify-content: flex-end; }
    td.actions::before { content: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <a class="breadcrumb" href="/">← Operator Tools</a>
  <header>
    <h1>Vendor Product Codes</h1>
    <div class="subtitle">APEX / vendor code &rarr; canonical UPC mapping, per vendor.</div>
  </header>

  <div class="chip-bar" id="vendor-chip-bar">
    <button class="chip" data-vendor="AV Live" aria-pressed="false" type="button">AV Live</button>
    <button class="chip" data-vendor="HAHA" aria-pressed="true" type="button">HAHA</button>
  </div>

  <section class="panel">
    <div class="panel-header">
      <h2>Mappings</h2>
      <button class="btn-primary" id="toggle-add">+ Add mapping</button>
    </div>

    <form id="add-form">
      <div>
        <label for="add-vendor">Vendor</label>
        <select id="add-vendor" required>
          <option value="AV Live">AV Live</option>
          <option value="HAHA" selected>HAHA</option>
        </select>
      </div>
      <div>
        <label id="add-code-label" for="add-vendor-code">APEX Code</label>
        <input id="add-vendor-code" type="text" required>
      </div>
      <div class="upc-field">
        <label for="add-canonical-upc">Canonical UPC</label>
        <input id="add-canonical-upc" type="text" autocomplete="off" required placeholder="Search by product name or UPC">
        <div class="upc-suggestions" id="add-upc-suggestions" hidden></div>
      </div>
      <div>
        <label for="add-product-name">Vendor's product name</label>
        <input id="add-product-name" type="text">
      </div>
      <div>
        <label for="add-source-note">Source note</label>
        <input id="add-source-note" type="text">
      </div>
      <div>
        <label for="add-status">Status</label>
        <select id="add-status">
          <option value="matched">Matched</option>
          <option value="pending">Pending</option>
          <option value="unmatched">Unmatched</option>
        </select>
      </div>
      <div>
        <button type="submit" class="btn-primary">Save</button>
        <button type="button" class="btn-quiet" id="cancel-add">Cancel</button>
      </div>
    </form>

    <table id="codes-table" hidden>
      <thead>
        <tr>
          <th id="code-col-header">APEX Code</th>
          <th>Vendor's Name</th>
          <th>Canonical UPC</th>
          <th>Catalog Product</th>
          <th>Status</th>
          <th>Source Note</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="codes-body"></tbody>
    </table>

    <div class="empty-state" id="empty-state" hidden>
      <strong>No mappings yet for this vendor</strong>
      Add the first one above.
    </div>
  </section>

  <div id="status-line"></div>
</main>

<script src="/shared/config.js"></script>
<script>
  // Set once "Vendor Product Codes — CRUD API" is published and active.
  const API_BASE = 'https://randysmith42.app.n8n.cloud/webhook/vendor-product-codes';
  const PRODUCTS_API_BASE = 'https://randysmith42.app.n8n.cloud/webhook/inventory/products';

  const CODE_LABELS = { HAHA: 'APEX Code', 'AV Live': 'Product Name' };

  let currentVendor = 'HAHA';
  let codes = [];
  let products = [];
  let editingId = null;

  const tableEl = document.getElementById('codes-table');
  const bodyEl = document.getElementById('codes-body');
  const emptyEl = document.getElementById('empty-state');
  const statusEl = document.getElementById('status-line');
  const codeColHeader = document.getElementById('code-col-header');
  const addCodeLabel = document.getElementById('add-code-label');
  const addVendorSelect = document.getElementById('add-vendor');
  const vendorChipBar = document.getElementById('vendor-chip-bar');

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function setStatus(message, isError) {
    statusEl.textContent = message || '';
    statusEl.className = isError ? 'error' : '';
  }

  function updateCodeLabels() {
    codeColHeader.textContent = CODE_LABELS[currentVendor] || 'Vendor Code';
  }
  function updateAddCodeLabel() {
    addCodeLabel.textContent = CODE_LABELS[addVendorSelect.value] || 'Vendor Code';
  }

  async function loadProducts() {
    const res = await fetch(PRODUCTS_API_BASE, { method: 'GET', headers: { 'X-API-Key': API_KEY } });
    if (!res.ok) throw new Error('Server returned ' + res.status);
    const data = await res.json();
    products = data.products || [];
  }

  async function loadCodes() {
    setStatus('Loading…');
    try {
      const res = await fetch(API_BASE + '?vendor=' + encodeURIComponent(currentVendor), {
        method: 'GET',
        headers: { 'X-API-Key': API_KEY }
      });
      if (!res.ok) throw new Error('Server returned ' + res.status);
      codes = await res.json();
      render();
      setStatus('');
    } catch (err) {
      setStatus('Could not load mappings — ' + err.message, true);
    }
  }

  async function writeCode(payload) {
    const res = await fetch(API_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
      body: JSON.stringify(payload)
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'Server returned ' + res.status);
    return body;
  }

  function render() {
    if (!codes.length) {
      tableEl.hidden = true;
      emptyEl.hidden = false;
      return;
    }
    tableEl.hidden = false;
    emptyEl.hidden = true;
    bodyEl.innerHTML = '';

    codes.forEach(row => {
      const tr = document.createElement('tr');
      if (editingId === row.id) {
        tr.classList.add('editing');
        tr.appendChild(editableCell('vendor_code', row, false)); // fixed — part of the unique key
        tr.appendChild(editableCell('product_name', row, true));
        tr.appendChild(editableCell('canonical_upc', row, true));
        tr.appendChild(td('Catalog Product', row.basement_inventory_name || '(not found)', ''));
        tr.appendChild(editableStatusCell(row));
        tr.appendChild(editableCell('source_note', row, true));
        tr.appendChild(editActionsCell(row));
      } else {
        tr.appendChild(td(CODE_LABELS[row.vendor] || 'Vendor Code', row.vendor_code, 'code'));
        tr.appendChild(td("Vendor's Name", row.product_name || '—', ''));
        tr.appendChild(td('Canonical UPC', row.canonical_upc || '—', 'code'));
        tr.appendChild(td('Catalog Product', row.basement_inventory_name || (row.canonical_upc ? '(not found)' : '—'), ''));
        const statusTd = td('Status', '', '');
        const pill = document.createElement('span');
        pill.className = 'pill ' + row.status;
        pill.textContent = row.status;
        statusTd.appendChild(pill);
        tr.appendChild(statusTd);
        tr.appendChild(td('Source Note', row.source_note || '—', ''));
        tr.appendChild(viewActionsCell(row));
      }
      bodyEl.appendChild(tr);
    });
  }

  function td(label, text, cls) {
    const cell = document.createElement('td');
    cell.dataset.label = label;
    if (cls) cell.className = cls;
    cell.textContent = text;
    return cell;
  }

  function editableCell(field, row, editable) {
    const cell = document.createElement('td');
    cell.dataset.label = field;
    const input = document.createElement('input');
    input.type = 'text';
    input.id = 'edit-' + field + '-' + row.id;
    input.value = row[field] || '';
    if (!editable) input.disabled = true;
    cell.appendChild(input);
    return cell;
  }

  function editableStatusCell(row) {
    const cell = document.createElement('td');
    cell.dataset.label = 'Status';
    const select = document.createElement('select');
    select.id = 'edit-status-' + row.id;
    ['matched', 'pending', 'unmatched'].forEach(s => {
      const o = document.createElement('option');
      o.value = s; o.textContent = s;
      if (row.status === s) o.selected = true;
      select.appendChild(o);
    });
    cell.appendChild(select);
    return cell;
  }

  function viewActionsCell(row) {
    const cell = document.createElement('td');
    cell.className = 'actions';
    const editBtn = document.createElement('button');
    editBtn.className = 'btn-quiet';
    editBtn.textContent = 'Edit';
    editBtn.onclick = () => { editingId = row.id; render(); };
    const delBtn = document.createElement('button');
    delBtn.className = 'btn-danger';
    delBtn.textContent = 'Delete';
    delBtn.onclick = () => deleteCode(row);
    cell.appendChild(editBtn);
    cell.appendChild(delBtn);
    return cell;
  }

  function editActionsCell(row) {
    const cell = document.createElement('td');
    cell.className = 'actions';
    const saveBtn = document.createElement('button');
    saveBtn.className = 'btn-primary';
    saveBtn.textContent = 'Save';
    saveBtn.onclick = () => saveEdit(row);
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn-quiet';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.onclick = () => { editingId = null; render(); };
    cell.appendChild(saveBtn);
    cell.appendChild(cancelBtn);
    return cell;
  }

  async function saveEdit(row) {
    const payload = {
      operation: 'update',
      id: row.id,
      canonical_upc: document.getElementById('edit-canonical_upc-' + row.id).value.trim(),
      product_name: document.getElementById('edit-product_name-' + row.id).value.trim(),
      source_note: document.getElementById('edit-source_note-' + row.id).value.trim() || null,
      status: document.getElementById('edit-status-' + row.id).value
    };
    setStatus('Saving…');
    try {
      await writeCode(payload);
      editingId = null;
      await loadCodes();
      setStatus('Saved.');
    } catch (err) {
      setStatus('Could not save — ' + err.message, true);
    }
  }

  async function deleteCode(row) {
    if (!confirm('Delete mapping for ' + row.vendor_code + '? This can\'t be undone.')) return;
    setStatus('Deleting…');
    try {
      await writeCode({ operation: 'delete', id: row.id });
      await loadCodes();
      setStatus('Deleted.');
    } catch (err) {
      setStatus('Could not delete — ' + err.message, true);
    }
  }

  // --- Vendor chip filter ---
  vendorChipBar.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    vendorChipBar.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
    chip.setAttribute('aria-pressed', 'true');
    currentVendor = chip.dataset.vendor;
    updateCodeLabels();
    loadCodes();
  });

  // --- Add form + UPC typeahead ---
  const addForm = document.getElementById('add-form');
  const addUpcInput = document.getElementById('add-canonical-upc');
  const suggestionsEl = document.getElementById('add-upc-suggestions');

  addUpcInput.addEventListener('input', () => {
    const q = addUpcInput.value.trim().toLowerCase();
    if (q.length < 2) { suggestionsEl.hidden = true; return; }
    const matches = products.filter(p =>
      (p.product_name && p.product_name.toLowerCase().includes(q)) ||
      (p.upc && p.upc.includes(q))
    ).slice(0, 15);
    if (!matches.length) { suggestionsEl.hidden = true; return; }
    suggestionsEl.innerHTML = matches.map(p =>
      '<div class="upc-suggestion" data-upc="' + escapeHtml(p.upc) + '">' + escapeHtml(p.product_name) +
      ' <span class="sug-upc">' + escapeHtml(p.upc) + '</span></div>'
    ).join('');
    suggestionsEl.hidden = false;
  });
  suggestionsEl.addEventListener('click', (e) => {
    const row = e.target.closest('.upc-suggestion');
    if (!row) return;
    addUpcInput.value = row.dataset.upc;
    suggestionsEl.hidden = true;
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.upc-field')) suggestionsEl.hidden = true;
  });

  document.getElementById('toggle-add').onclick = () => { addForm.classList.add('open'); updateAddCodeLabel(); };
  document.getElementById('cancel-add').onclick = () => { addForm.classList.remove('open'); addForm.reset(); };
  addVendorSelect.addEventListener('change', updateAddCodeLabel);

  addForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      operation: 'create',
      vendor: addVendorSelect.value,
      vendor_code: document.getElementById('add-vendor-code').value.trim(),
      canonical_upc: document.getElementById('add-canonical-upc').value.trim(),
      product_name: document.getElementById('add-product-name').value.trim(),
      source_note: document.getElementById('add-source-note').value.trim() || null,
      status: document.getElementById('add-status').value
    };
    setStatus('Saving…');
    try {
      await writeCode(payload);
      addForm.reset();
      addForm.classList.remove('open');
      await loadCodes();
      setStatus('Added.');
    } catch (err) {
      setStatus('Could not add — ' + err.message, true);
    }
  });

  updateCodeLabels();
  updateAddCodeLabel();
  loadProducts()
    .then(loadCodes)
    .catch(err => setStatus('Could not load product catalog — ' + err.message, true));
</script>
</body>
</html>
