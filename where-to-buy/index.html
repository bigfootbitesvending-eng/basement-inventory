<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bigfoot Bites — Where to Buy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/styles.css">
<link rel="stylesheet" href="/shared/components.css">
<link rel="stylesheet" href="/shared/ledger.css">
<style>
  /* Where to buy each product, from the last price check (PRD-007). Grouped by store, then category, then name (Behavior 9). */
  [hidden] { display: none !important; }
  main { max-width: 680px; margin: 0 auto; padding: 2.5rem 1rem 4rem; }
  header { margin-bottom: 1.25rem; border-bottom: 2px solid var(--ink); padding-bottom: 1rem; }
  .breadcrumb { display: inline-block; font-size: 0.8rem; color: var(--ink-soft); text-decoration: none; margin-bottom: 0.6rem; }
  h1 { font-size: 1.6rem; margin: 0 0 0.25rem; }
  .subtitle { color: var(--ink-soft); font-size: 0.88rem; }
  .xlink { display: inline-block; min-height: 44px; line-height: 44px; font-size: 0.9rem; color: var(--ledger-green); }
  .asof { background: #fff; border: 1px solid var(--rule); border-left: 4px solid var(--ledger-green); border-radius: 6px; padding: 0.6rem 0.8rem; font-size: 0.9rem; margin-bottom: 1rem; }
  .asof .stores { color: var(--ink-soft); margin-top: 0.15rem; font-size: 0.84rem; }
  .legend { color: var(--ink-soft); margin-top: 0.35rem; font-size: 0.82rem; }
  .unchecked { background: var(--status-error-soft); border: 1px solid var(--status-error); border-radius: 6px; padding: 0.6rem 0.8rem; margin-bottom: 1rem; font-size: 0.88rem; }
  .unchecked h2 { font-size: 1rem; margin: 0 0 0.25rem; color: var(--status-error); }
  .unchecked ul { margin: 0.4rem 0 0; padding-left: 1.1rem; }
  .unchecked li { margin-bottom: 0.4rem; }
  .since { background: #fff; border: 1px solid var(--rule); border-left: 4px solid var(--status-draft); border-radius: 6px; padding: 0.6rem 0.8rem; font-size: 0.88rem; margin-bottom: 1rem; }
  .findrow input { width: 100%; box-sizing: border-box; font: inherit; font-size: 0.95rem; padding: 0.5rem 0.6rem; border: 1px solid var(--rule); border-radius: 4px; background: #fff; color: var(--ink); min-height: 44px; }
  .count { font-size: 0.8rem; color: var(--ink-soft); margin: 0.35rem 0 0.25rem; }
  .nomatch { background: #fff; border: 1px solid var(--rule); border-radius: 6px; padding: 0.9rem 0.75rem; font-size: 0.9rem; margin-top: 0.75rem; }
  details.storegrp { margin-top: 1rem; }
  details.storegrp > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; min-height: 44px; padding: 0.25rem 0; border-bottom: 2px solid var(--ink); }
  details.catgrp > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 0.35rem; min-height: 44px; font-weight: 600; font-size: 0.95rem; }
  details.storegrp > summary::-webkit-details-marker, details.catgrp > summary::-webkit-details-marker { display: none; }
  details.storegrp > summary::before, details.catgrp > summary::before { content: '\25BE'; color: var(--ledger-green); width: 1rem; }
  details.storegrp:not([open]) > summary::before, details.catgrp:not([open]) > summary::before { content: '\25B8'; }
  .sname { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; }
  .scount { font-size: 0.82rem; color: var(--ink-soft); font-weight: 400; }
  .storebody { padding-top: 0.25rem; }
  .storenone { margin-top: 1rem; padding: 0.6rem 0; border-bottom: 2px solid var(--rule); font-size: 0.9rem; color: var(--ink-soft); }
  .storenone b { font-family: var(--font-display); font-size: 1.05rem; color: var(--ink); }
  .card { background: #fff; border: 1px solid var(--rule); border-radius: 6px; padding: 0.6rem 0.75rem 0; margin-bottom: 0.5rem; }
  .pname { font-weight: 700; font-size: 1rem; margin-bottom: 0.15rem; }
  .best { font-size: 0.95rem; line-height: 1.35; }
  .save { display: inline-block; font-size: 0.8rem; font-weight: 600; color: var(--ledger-green); background: var(--ledger-green-soft); border-radius: 999px; padding: 0.05rem 0.5rem; white-space: nowrap; }
  .alt { font-size: 0.88rem; margin-top: 0.15rem; }
  .tag { display: inline-block; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 0.1rem 0.4rem; border-radius: 3px; background: var(--ledger-green-soft); color: var(--ledger-green); vertical-align: 1px; }
  .tag.ship { background: var(--status-draft-soft); color: #8a5a10; }
  .tag.bad { background: var(--status-error-soft); color: var(--status-error); }
  .tag.hand, .tag.usual { background: var(--paper); color: var(--ink-soft); border: 1px solid var(--rule); }
  .price { font-weight: 700; white-space: nowrap; }
  .sub { color: var(--ink-soft); font-size: 0.82rem; line-height: 1.4; }
  details.more { margin-top: 0.1rem; }
  details.more > summary { cursor: pointer; font-size: 0.82rem; color: var(--ledger-green); font-weight: 600; min-height: 44px; line-height: 44px; }
  table.t { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  table.t th { text-align: left; color: var(--ink-soft); font-weight: 600; border-bottom: 1px solid var(--rule); padding: 0.25rem 0.3rem; }
  table.t td { padding: 0.35rem 0.3rem; border-bottom: 1px solid var(--rule); vertical-align: top; overflow-wrap: anywhere; }
  table.t td.n { white-space: nowrap; }
  .hist { font-size: 0.82rem; color: var(--ink-soft); margin: 0.5rem 0 0.6rem; line-height: 1.5; }
  .hist b { color: var(--ink); }
  .empty { color: var(--ink-soft); padding: 1.25rem 0; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <a class="breadcrumb" href="/">← Operator Tools</a>
    <h1>Where to Buy</h1>
    <div class="subtitle">The cheapest store for each product, per bottle, can or bar, from the last price check.</div>
    <a class="xlink" href="../price-check-list/">Change what&rsquo;s checked &rarr;</a>
  </header>
  <div id="content" class="empty">Loading…</div>
</main>

<script src="/shared/config.js"></script>
<script src="/shared/messages.js"></script>
<script src="/shared/groups.js"></script>
<script>
(function () {
  // config.js declares API_KEY. Results come from CARTA - Read Results, which calls CARTA - Build Results.
  var RESULTS_API = 'https://randysmith42.app.n8n.cloud/webhook/carta/results';
  var root = document.getElementById('content');
  // closed: the stores and categories collapsed on this visit only. A reload opens them all again, so a collapsed
  // store can't hide next week's deal (E-68).
  var state = { items: null, find: '', closed: {} };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function money(n) { return n == null ? '—' : '$' + Number(n).toFixed(2); }
  function num(n) { return String(Number(n)); }
  // Every date shows in Central, the business's time. Never "today" (E-35).
  function central(iso, withTime) {
    var d = new Date(iso);
    var o = { timeZone: 'America/Chicago', weekday: 'short', month: 'numeric', day: 'numeric' };
    if (withTime) { o.hour = 'numeric'; o.minute = '2-digit'; }
    var p = new Intl.DateTimeFormat('en-US', o).formatToParts(d);
    var g = function (t) { return (p.filter(function (x) { return x.type === t; })[0] || {}).value; };
    return g('weekday') + ' ' + g('month') + '/' + g('day') + (withTime ? ', ' + g('hour') + ':' + g('minute') + ' ' + g('dayPeriod') : '');
  }
  function day(dateOnly) { return central(dateOnly + 'T17:00:00Z', false); }
  function ways(a) {
    if (!a) return '';
    var w = [];
    if (a.in_store) w.push('in store');
    if (a.pickup) w.push('pickup');
    if (a.delivery) w.push('delivery');
    if (!w.length && a.ship) return 'ships only';
    return w.join(', ') + (a.ship ? ', or ships' : '');
  }
  function pack(l) { return l.units + ' × ' + num(l.unit_size) + ' ' + l.uom; }
  function dealBits(l) { return l.deal_text ? esc(l.deal_text) + (l.deal_ends ? ', ends ' + esc(central(l.deal_ends, false)) : '') : ''; }
  function byName(a, b) { return a.localeCompare(b); }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

  // By catalog category, a missing one as Other after every named category, then by name (E-73; /shared/groups.js).
  function byCategory(list) {
    return BBGroups.byName(list, function (p) { return p.category; }, function (p) { return p.name; })
      .map(function (g) { return { cat: g.key, items: g.items }; });
  }
  // What buying at the lowest store saves per unit against the usual store (E-66). Worked from the prices as shown, to the
  // cent, so the card's own numbers add up: an exact price with a half cent would otherwise make the saving a cent off
  // the shown difference. None when the usual store
  // is the lowest, isn't on the list, wasn't checked, or the shown prices are equal.
  function cents(n) { return Math.round(Number(n) * 100); }
  function saving(p) {
    var u = p.usual || {};
    if (!p.lowest || p.lowest.store === p.usual_store || u.state !== 'checked' || !(Number(u.unit_price) > 0)) return null;
    var d = cents(u.unit_price) - cents(p.lowest.unit_price);
    if (!(d >= 1)) return null;
    return { each: d / 100, pct: Math.round(100 * d / cents(u.unit_price)) };
  }
  function usualLine(p) {
    var u = p.usual || {};
    if (u.state === 'not_swept') return 'Usual store: ' + esc(p.usual_store) + ' (not in the price check)';
    if (u.state === 'not_listed') return 'Usual store: ' + esc(p.usual_store) + ' (not on the list for this product)';
    if (u.state === 'by_hand') return 'Usual store: ' + esc(p.usual_store) + ', checked by hand this run';
    if (u.state === 'not_in_run') return 'Usual store: ' + esc(p.usual_store) + ', not in the last run';
    if (u.state === 'unchecked') return 'Usual store: ' + esc(p.usual_store) + ', unchecked this run (' + esc(u.reason) + ')';
    if (p.lowest && p.lowest.store === p.usual_store) return '';                                  // the price line says so
    if (p.lowest_no_ship && p.lowest_no_ship.store === p.usual_store && !p.same) return '';        // the without-shipping line says so
    return 'Usual store: ' + esc(p.usual_store) + ', ' + money(u.unit_price) + ' each';
  }
  function rowCells(p, l) {
    var st = esc(l.store) + (l.store === p.usual_store ? ' <span class="tag usual">usual</span>' : '');
    if (l.state === 'by_hand') return '<tr><td>' + st + '</td><td>—</td><td class="n"><span class="tag hand">by hand</span></td><td>Store switched off</td></tr>';
    if (l.state === 'not_in_run') return '<tr><td>' + st + '</td><td>—</td><td class="n">—</td><td>Not in the last run</td></tr>';
    if (l.state === 'unchecked') return '<tr><td>' + st + '</td><td>—</td><td class="n"><span class="tag bad">unchecked</span></td><td>' + esc(l.reason) + '</td></tr>';
    return '<tr><td>' + st + '</td><td>' + esc(pack(l)) + '<br>' + money(l.pack_price) + '</td><td class="n">' + money(l.unit_price) + '</td><td>' +
      esc(ways(l.availability)) + (l.deal_text ? '<br>' + dealBits(l) : '') + '</td></tr>';
  }
  function history(p) {
    var trend = Object.keys(p.trend || {}).filter(function (s) { return (p.trend[s] || []).length; }).map(function (s) {
      return esc(s) + ' ' + p.trend[s].map(money).join(' &rarr; ');
    });
    return '<div class="hist"><b>Trend</b> (each, last 3 runs): ' + (trend.join('; ') || 'not enough history') +
      '<br><b>Last deal:</b> ' + (p.last_deal ? esc(p.last_deal.text) + ' at ' + esc(p.last_deal.store) + ', ' + esc(day(p.last_deal.run_date)) : 'none seen yet') +
      '<br><b>Next likely deal:</b> ' + (p.next_deal ? esc(p.next_deal.store) + ' around ' + esc(day(p.next_deal.date)) : 'not enough history') + '</div>';
  }
  function detailsHtml(p) {
    return '<details class="more"><summary>All stores, history</summary><table class="t"><tr><th>Store</th><th>Pack</th><th>Each</th><th>Get it</th></tr>' +
      (p.rows || []).map(function (l) { return rowCells(p, l); }).join('') + '</table>' + history(p) + '</details>';
  }
  // One product under its lowest store: the price, what it saves, the pack and deal, and the way to get it without shipping
  // when the lowest needs it (E-66, E-67).
  function card(p) {
    var l = p.lowest, s = saving(p), w = ways(l.availability);
    var h = '<section class="card" data-upc="' + esc(p.upc) + '"><div class="pname">' + esc(p.name) + '</div>' +
      '<div class="best"><span class="price">' + money(l.unit_price) + ' each</span>' + (w === 'ships only' ? ' <span class="tag ship">ships</span>' : '') +
      (l.store === p.usual_store ? ' <span class="sub">· your usual store</span>' : '') +
      (s ? ' <span class="save">Save ' + money(s.each) + ' (' + s.pct + '%)</span>' : '') + '</div>';
    var bits = [esc(pack(l)) + ' at ' + money(l.pack_price)];
    if (l.deal_text) bits.push(dealBits(l));
    if (w) bits.push(esc(w));
    if (!p.same) bits.push('before shipping fees and order minimums');
    h += '<div class="sub">' + bits.join(' · ') + '</div>';
    if (!p.same) {
      var n = p.lowest_no_ship;
      h += '<div class="alt">' + (n ? 'Without shipping: <b>' + esc(n.store) + '</b> ' + money(n.unit_price) + ' each' + (n.store === p.usual_store ? ', your usual store' : '') : 'None available without shipping.') + '</div>';
    }
    var u = usualLine(p);
    if (u) h += '<div class="sub">' + u + '</div>';
    return h + detailsHtml(p) + '</section>';
  }
  function noPriceCard(p) {
    var u = usualLine(p);
    return '<section class="card" data-upc="' + esc(p.upc) + '"><div class="pname">' + esc(p.name) + '</div><div class="sub">No price this run.' + (u ? ' ' + u + '.' : '') + '</div>' + detailsHtml(p) + '</section>';
  }
  function group(key, title, count, body, extra) {
    return '<details class="storegrp" data-key="' + esc(key) + '"' + (state.closed[key] ? '' : ' open') + '><summary><span class="sname">' + title + '</span> <span class="scount">' +
      plural(count, 'product', 'products') + '</span></summary><div class="storebody">' + (extra || '') + body + '</div></details>';
  }
  function categories(storeKey, list) {
    return byCategory(list).map(function (g) {
      var key = storeKey + '|' + g.cat;
      return '<details class="catgrp" data-key="' + esc(key) + '"' + (state.closed[key] ? '' : ' open') + '><summary>' + esc(g.cat) + ' <span class="scount">(' + g.items.length + ')</span></summary>' +
        g.items.map(card).join('') + '</details>';
    }).join('');
  }

  function render() {
    var items = state.items;
    var run = items.filter(function (i) { return i.kind === 'run'; })[0];
    if (!run || run.none) {
      root.className = 'empty';
      root.innerHTML = '<b>No runs yet.</b><br>The list has ' + ((run && run.active_rows) || 0) + ' active rows. Start a price check from the laptop to see where to buy each product.';
      return;
    }
    var h = '<div class="asof">Prices as of <b>' + esc(central(run.posted_at, true)) + '</b><div class="stores">Checked: ' + esc((run.stores_checked || []).join(', ') || 'none') +
      ((run.stores_not_checked || []).length ? ' · Not checked: ' + esc(run.stores_not_checked.join(', ')) : '') +
      ((run.stores_by_hand || []).length ? ' · Checked by hand: ' + esc(run.stores_by_hand.join(', ')) : '') + '</div>' +
      '<div class="legend">Each product is under the store with its lowest price. &ldquo;Save&rdquo; is per bottle, can or bar, against your usual store.</div></div>';
    var un = items.filter(function (i) { return i.kind === 'unchecked'; });
    if (un.length) {
      // A store-level failure (bot check, wrong store) is one line per store with its pages beneath (E-04).
      var groups = [];
      un.forEach(function (u) {
        var store = /^(bot check|wrong store)/.test(u.reason || '');
        var g = store && groups.filter(function (x) { return x.store === u.store && x.reason === u.reason; })[0];
        if (g) g.names.push(u.product_name); else groups.push({ store: u.store, reason: u.reason, storeLevel: store, names: [u.product_name] });
      });
      var pages = function (n) { return n + (n === 1 ? ' page' : ' pages'); };
      h += '<section class="unchecked"><h2>Unchecked (' + pages(un.length) + ')</h2><div>No price for these; nothing is filled in from an earlier run.</div><ul>' +
        groups.map(function (g) {
          if (!g.storeLevel) return '<li><b>' + esc(g.names[0]) + '</b> at ' + esc(g.store) + ': ' + esc(g.reason) + '</li>';
          var why = /^bot check/.test(g.reason) ? '<div>' + esc(g.store) + ' showed a “verify you’re human” page when the price check opened it, so it skipped every ' + esc(g.store) +
            ' page this run rather than guess. Check these at ' + esc(g.store) + ' by hand, or clear the check in the price-check browser on the laptop and rerun. Two runs in a row: switch ' + esc(g.store) + ' off on the Price Check List.</div>' : '';
          return '<li><b>' + esc(g.store) + ': ' + esc(g.reason) + '</b> (' + pages(g.names.length) + ')' + why + '<div class="sub">Pages: ' + esc(g.names.join(', ')) + '</div></li>';
        }).join('') + '</ul></section>';
    }

    var prods = items.filter(function (i) { return i.kind === 'product'; });
    // A product whose every row came onto the list after this run is named here, not dropped (E-70).
    var added = prods.filter(function (p) { return !p.lowest && (p.rows || []).length && p.rows.every(function (l) { return l.state === 'not_in_run'; }); });
    var priced = prods.filter(function (p) { return p.lowest; });
    var noPrice = prods.filter(function (p) { return !p.lowest && added.indexOf(p) < 0; });
    if (added.length) {
      h += '<div class="since"><b>Added since this run:</b> ' + esc(added.map(function (p) { return p.name; }).sort(byName).join('; ')) + '. ' +
        (added.length === 1 ? 'It shows' : 'They show') + ' here after the next price check.</div>';
    }

    var f = state.find.trim().toLowerCase();
    var match = function (p) { return !f || String(p.name).toLowerCase().indexOf(f) >= 0; };
    var shownPriced = priced.filter(match), shownNo = noPrice.filter(match);
    var total = priced.length + noPrice.length, shown = shownPriced.length + shownNo.length;
    h += '<div class="findrow"><input id="find" type="search" autocomplete="off" placeholder="Find a product" aria-label="Find a product" value="' + esc(state.find) + '"></div>';
    h += '<div class="count">' + (f ? shown + ' of ' + plural(total, 'product', 'products') : plural(total, 'product', 'products')) + ', by store, category, then name</div>';
    if (f && !shown) {
      h += '<div class="nomatch"><b>No product matches &ldquo;' + esc(state.find.trim()) + '&rdquo;.</b><br><span class="sub">Check the spelling. A product shows here only if it&rsquo;s on the Price Check List and was in the last run.</span></div>';
    }

    // Stores by name: every store checked this run, plus any store a lowest price came from (E-49).
    var stores = (run.stores_checked || []).slice();
    priced.forEach(function (p) { if (stores.indexOf(p.lowest.store) < 0) stores.push(p.lowest.store); });
    stores.sort(byName).forEach(function (store) {
      var mine = shownPriced.filter(function (p) { return p.lowest.store === store; });
      if (!mine.length) {
        if (!f && !priced.some(function (p) { return p.lowest.store === store; })) h += '<div class="storenone"><b>' + esc(store) + '</b>: not the lowest for anything this run.</div>';
        return;
      }
      var allShip = mine.every(function (p) { return !p.same; });
      h += group(store, esc(store), mine.length, categories(store, mine), allShip ? '<div class="sub">Prices here are before shipping fees and order minimums.</div>' : '');
    });
    if (shownNo.length) {
      h += group('~none','No Price This Run', shownNo.length, shownNo.sort(function (a, b) { return byName(a.name, b.name); }).map(noPriceCard).join(''),
        '<div class="sub">Every line for these was unchecked or checked by hand this run.</div>');
    }
    root.className = '';
    root.innerHTML = h;
  }

  // Remember what's collapsed on this visit, so typing in the find box doesn't open it all again.
  root.addEventListener('toggle', function (e) {
    var t = e.target;
    if (t.matches && t.matches('details.storegrp, details.catgrp')) state.closed[t.getAttribute('data-key')] = !t.open;
  }, true);
  root.addEventListener('input', function (e) {
    if (e.target.id !== 'find') return;
    state.find = e.target.value;
    var pos = e.target.selectionStart;
    render();
    var el = document.getElementById('find'); if (el) { el.focus(); el.setSelectionRange(pos, pos); }
  });

  fetch(RESULTS_API, { headers: { 'X-API-Key': API_KEY } })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (b) { if (!r.ok) throw new Error(b.error || ('HTTP ' + r.status)); return b; }); })
    .then(function (items) { state.items = Array.isArray(items) ? items : []; render(); })
    .catch(function (err) {
      root.className = 'empty'; root.textContent = '';
      BBMessages.show('error', 'Couldn\'t load Where to Buy. Reload the page to try again.', { why: err.message });
    });
})();
</script>
</body>
</html>
