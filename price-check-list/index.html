<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bigfoot Bites — Price Check List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/styles.css">
<link rel="stylesheet" href="/shared/components.css">
<link rel="stylesheet" href="/shared/ledger.css">
<style>
  /* The list the weekly price check reads (PRD-007). */
  [hidden] { display: none !important; }
  main { max-width: 680px; margin: 0 auto; padding: 2.5rem 1rem 4rem; }
  header { margin-bottom: 1.25rem; border-bottom: 2px solid var(--ink); padding-bottom: 1rem; }
  .breadcrumb { display: inline-block; font-size: 0.8rem; color: var(--ink-soft); text-decoration: none; margin-bottom: 0.6rem; }
  h1 { font-size: 1.6rem; margin: 0 0 0.25rem; }
  .subtitle { color: var(--ink-soft); font-size: 0.88rem; }
  .xlink { display: inline-block; min-height: 44px; line-height: 44px; font-size: 0.9rem; color: var(--ledger-green); }
  .panel { background: #fff; border: 1px solid var(--rule); border-radius: 6px; padding: 0.75rem; margin-bottom: 1.25rem; }
  .panel h2 { font-size: 1rem; margin: 0 0 0.25rem; }
  .sub { color: var(--ink-soft); font-size: 0.82rem; }
  .srow { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; padding: 0.5rem 0; border-top: 1px solid var(--rule); font-size: 0.9rem; }
  .srow:first-of-type { border-top: 0; }
  .srow .sub { display: block; }
  .btn { font: inherit; font-size: 0.88rem; font-weight: 600; min-height: 44px; padding: 0.4rem 0.9rem; border-radius: 4px; border: 1px solid var(--rule); background: transparent; color: var(--ink-soft); cursor: pointer; }
  .btn.primary { background: var(--ledger-green); border-color: var(--ledger-green); color: #fff; }
  .btn.primary:disabled { background: var(--rule); border-color: var(--rule); color: var(--ink-soft); cursor: default; }
  .btn.danger { color: var(--status-error); }
  .btn.big { width: 100%; font-family: var(--font-display); font-size: 1rem; border-radius: 6px; }
  .switch { min-width: 4.5rem; border: 1px solid var(--ink); color: var(--ink); }
  .switch[aria-pressed="true"] { background: var(--ledger-green); border-color: var(--ledger-green); color: #fff; }
  details.stores { margin: 0 0 0.25rem; }
  details.stores > summary { cursor: pointer; font-size: 0.86rem; color: var(--ledger-green); font-weight: 600; min-height: 44px; line-height: 44px; }
  .phead { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin: 1.25rem 0 0.5rem; }
  .phead .pn { font-family: var(--font-display); font-weight: 700; font-size: 1rem; }
  .phead select, .field select, .field input { font: inherit; font-size: 0.95rem; padding: 0.5rem; border: 1px solid var(--rule); border-radius: 4px; background: #fff; color: var(--ink); min-height: 44px; }
  .phead select { font-size: 0.88rem; min-height: 40px; }
  .tag { display: inline-block; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 0.1rem 0.4rem; border-radius: 3px; margin-left: 0.35rem; background: var(--status-draft-soft); color: #8a5a10; vertical-align: 1px; }
  .tag.bad { background: var(--status-error-soft); color: var(--status-error); }
  .lrow { background: #fff; border: 1px solid var(--rule); border-radius: 6px; padding: 0.6rem 0.75rem; margin-bottom: 0.5rem; font-size: 0.9rem; }
  .lrow .nm { font-weight: 700; }
  .lrow .meta { color: var(--ink-soft); font-size: 0.82rem; margin-top: 0.2rem; line-height: 1.45; overflow-wrap: anywhere; }
  .lrow .meta a { color: var(--ledger-green); }
  .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem; }
  .field { margin-top: 0.75rem; }
  .field label { display: block; font-size: 0.82rem; color: var(--ink-soft); margin-bottom: 0.25rem; }
  .field input, .field select { width: 100%; }
  .hint { font-size: 0.8rem; color: var(--ink-soft); margin-top: 0.25rem; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .picks { border: 1px solid var(--rule); border-radius: 4px; margin-top: 0.25rem; max-height: 15rem; overflow-y: auto; background: #fff; }
  .picks button { display: block; width: 100%; text-align: left; font: inherit; font-size: 0.9rem; padding: 0.6rem; min-height: 44px; border: 0; border-top: 1px solid var(--rule); background: #fff; color: var(--ink); cursor: pointer; }
  .picks button:first-child { border-top: 0; }
  .picked { font-weight: 600; margin-top: 0.25rem; }
  .empty { color: var(--ink-soft); padding: 1.25rem 0; text-align: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .chip { font: inherit; font-size: 0.9rem; min-height: 44px; padding: 0.4rem 0.9rem; border-radius: 999px; border: 1px solid var(--rule); background: #fff; color: var(--ink); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--ledger-green); border-color: var(--ledger-green); color: #fff; }
  .chip:disabled { color: var(--ink-soft); background: var(--paper); text-decoration: line-through; cursor: default; }
  .built { margin-top: 0.3rem; font-size: 0.84rem; overflow-wrap: anywhere; }
  .built a { color: var(--ledger-green); }
  .built.ok { color: var(--ledger-green); font-weight: 600; }
  .built.bad { color: var(--status-error); font-weight: 600; }
  .built.warn { color: #8a5a10; font-weight: 600; }
  .btn.next { flex: 1 1 100%; font-family: var(--font-display); font-size: 1rem; border-radius: 6px; }
  .done { padding: 0.75rem; background: var(--ledger-green-soft); border-radius: 6px; margin-top: 0.75rem; }
</style>
</head>
<body>
<main>
  <header>
    <a class="breadcrumb" href="/">← Operator Tools</a>
    <h1>Price Check List</h1>
    <div class="subtitle">The store pages each price check reads, which stores are on, and where you usually buy each product.</div>
    <a class="xlink" href="../where-to-buy/">See Where to Buy &rarr;</a>
  </header>
  <div id="content" class="empty">Loading…</div>
</main>

<script src="/shared/config.js"></script>
<script src="/shared/messages.js"></script>
<script>
(function () {
  // config.js (loaded above) declares API_KEY. The list API is CARTA - List CRUD API; products come from Inventory - List Products.
  var LIST_API = 'https://randysmith42.app.n8n.cloud/webhook/carta-list';
  var PRODUCTS_API = 'https://randysmith42.app.n8n.cloud/webhook/inventory/products';
  // The units the catalog's names use (oz 170, ct 33, ml 1, gal 1). Fluid and weight ounces are one unit.
  var UOMS = ['oz', 'ct', 'ml', 'gal'];
  // Stores are offered in this order when adding; the next store not yet on the list comes first.
  var ADD_ORDER = ['Kroger', 'Walmart', "Sam's", 'Amazon'];

  var state = { stores: [], rows: [], products: null, adding: false, editId: null, busy: false, undo: null, pick: null, filter: '', add: null, open: {} };
  var root = document.getElementById('content');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function swept() { return state.stores.filter(function (s) { return s.swept; }); }
  function storeOptions(selected, list) {
    return (list || state.stores).map(function (s) { return '<option' + (s.store === selected ? ' selected' : '') + '>' + esc(s.store) + '</option>'; }).join('');
  }
  // Units per pack: every whole number to 60, then the bigger case sizes. A saved value outside the list is kept as an option.
  var PACKS = []; for (var i = 1; i <= 60; i++) PACKS.push(i); PACKS = PACKS.concat([72, 84, 96, 120, 144]);
  function packOptions(selected) {
    var list = PACKS.slice(); var sel = Number(selected) || 0;
    if (sel && list.indexOf(sel) < 0) { list.push(sel); list.sort(function (a, b) { return a - b; }); }
    return '<option value=""' + (sel ? '' : ' selected') + '>Choose</option>' + list.map(function (n) { return '<option' + (n === sel ? ' selected' : '') + '>' + n + '</option>'; }).join('');
  }
  function normUom(u) { u = String(u || '').toLowerCase(); return u === 'fl oz' ? 'oz' : u; }
  function uomOptions(selected) {
    selected = normUom(selected);
    return '<option value=""' + (selected ? '' : ' selected') + '>Choose</option>' + UOMS.map(function (u) { return '<option' + (u === selected ? ' selected' : '') + '>' + u + '</option>'; }).join('');
  }
  // Size from the catalog name's end: "Coca-Cola Classic, 16.9 Oz", "Toothbrush, 1 Ct", "Toilet Paper, 4 Rolls", "Milk, 0.5 Gal".
  function sizeFromName(name) {
    var m = /(?:^|[\s,])(\d*\.?\d+)\s*(fl\.?\s*oz|oz|ct|count|pieces?|rolls?|ml|gal)\.?\s*$/i.exec(String(name || ''));
    if (!m) return null;
    var u = m[2].toLowerCase().replace(/[\s.]/g, '');
    u = (u === 'floz' || u === 'oz') ? 'oz' : (u === 'ml' || u === 'gal') ? u : 'ct';
    return { size: String(Number(m[1])), uom: u };
  }
  // Kroger's item id is the UPC without its check digit, padded to 13 digits.
  function krogerId(upc) { return ('0000000000000' + String(upc).slice(0, -1)).slice(-13); }
  // Paste a link or type an id: either way, read the id and build the link. Kroger needs its full link (its address needs the name).
  var ITEM = {
    Kroger: { label: 'Kroger page link', ph: 'Paste the Kroger product page link', re: /kroger\.com\/p\/[^/?#]+\/(\d{13})/ },
    Walmart: { label: 'Walmart item number', ph: 'e.g. 10535170, or paste the link', re: /walmart\.com\/ip\/(?:[^/?#]+\/)?(\d{5,})/, build: 'https://www.walmart.com/ip/' },
    "Sam's": { label: "Sam's item number", ph: 'e.g. 15098707355, or paste the link', re: /samsclub\.com\/(?:ip|p)\/(?:[^/?#]+\/)?(?:prod)?(\d{5,})/, build: 'https://www.samsclub.com/ip/' },
    Amazon: { label: 'Amazon ASIN', ph: 'e.g. B000T9WM62, or paste the link', re: /amazon\.com\/(?:[^/?#]+\/)?(?:dp|gp\/product)\/([A-Z0-9]{10})/, build: 'https://www.amazon.com/dp/', tail: '/' }
  };
  function readItem(store, raw) {
    raw = String(raw || '').trim();
    var spec = ITEM[store];
    if (!spec) return { id: null, link: null };
    var m = spec.re.exec(raw);
    if (store === 'Kroger') return { id: m ? m[1] : null, link: m ? raw.split(/[?#]/)[0] : null };
    var id = m ? m[1] : (/^https?:/i.test(raw) || /\s/.test(raw) ? null : raw);
    return id ? { id: id, link: spec.build + id + (spec.tail || '') } : { id: null, link: null };
  }
  function rowsFor(upc) { return state.rows.filter(function (r) { return r.upc === upc; }); }
  function storesLeft(upc) {
    var have = rowsFor(upc).map(function (r) { return r.store; });
    var swept = state.stores.filter(function (x) { return x.swept; }).map(function (x) { return x.store; });
    var order = ADD_ORDER.filter(function (x) { return swept.indexOf(x) >= 0; }).concat(swept.filter(function (x) { return ADD_ORDER.indexOf(x) < 0; }));
    return order.filter(function (x) { return have.indexOf(x) < 0; });
  }
  // What the add form starts with for a product: size and units from its other rows, else size from its name.
  function startAdd(pick, keep) {
    var rows = rowsFor(pick.upc), last = rows[rows.length - 1], left = storesLeft(pick.upc);
    var a = { store: left[0] || null, item: '', units: 0, size: '', uom: '', from: '' };
    if (keep) { a.units = keep.units; a.size = keep.size; a.uom = keep.uom; a.from = 'Same as the ' + rows.map(function (r) { return r.store; }).join(' and ') + ' row' + (rows.length > 1 ? 's.' : '.'); }
    else if (last) { a.units = last.units_per_pack; a.size = num(last.unit_size); a.uom = normUom(last.unit_size_uom); a.from = 'Same as the ' + rows.map(function (r) { return r.store; }).join(' and ') + ' row' + (rows.length > 1 ? 's.' : '.'); }
    else {
      var z = sizeFromName(pick.name);
      if (z) { a.size = z.size; a.uom = z.uom; a.from = 'From the product name. Check it.' + (z.uom === 'ct' ? ' Counted items use ct: a 4-pack of toothbrushes is 4 × 1 ct.' : ''); }
      else a.from = 'The name has no size, so pick one. A toothbrush is 1 ct.';
    }
    return a;
  }
  function host(url) { try { return new URL(url).hostname; } catch (e) { return url; } }
  function num(n) { return String(Number(n)); }

  // ---- API ------------------------------------------------------------
  function getJson(url) {
    return fetch(url, { headers: { 'X-API-Key': API_KEY } }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (b) { if (!r.ok) throw new Error(b.error || ('HTTP ' + r.status)); return b; });
    });
  }
  function post(body) {
    return fetch(LIST_API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY }, body: JSON.stringify(body) })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (b) {
          if (!r.ok) { var e = new Error(b.error || ('Nothing changed. The server said HTTP ' + r.status + '.')); e.why = b.why || null; throw e; }
          return b;
        });
      });
  }
  function load() {
    return getJson(LIST_API).then(function (items) {
      items = Array.isArray(items) ? items : [];
      state.stores = items.filter(function (i) { return i.kind === 'store'; });
      state.rows = items.filter(function (i) { return i.kind === 'row'; });
    });
  }
  function loadProducts() {
    if (state.products) return Promise.resolve();
    return getJson(PRODUCTS_API).then(function (b) {
      state.products = (b.products || []).filter(function (p) { return !p.retired_at; });
    });
  }

  // One write at a time; the button that started it is disabled until the answer comes back (no double taps).
  function write(body, okText, after, undo) {
    if (state.busy) return;
    state.undo = null;
    state.busy = true;
    BBMessages.show('working', 'Saving…');
    render();
    post(body).then(function (changed) {
      return load().then(function () {
        state.busy = false;
        if (after) after(changed);
        state.undo = undo || null;
        render();
        BBMessages.show('success', okText(changed), state.undo ? { action: 'Undo', onHide: function () { state.undo = null; } } : {});
      });
    }).catch(function (err) {
      state.busy = false;
      render();
      BBMessages.show('error', /^Nothing changed/.test(err.message) ? err.message : 'Nothing changed. ' + err.message, { why: err.why || (err.message === 'Failed to fetch' ? 'Failed to fetch' : null) });
    });
  }
  document.addEventListener('click', function (e) {
    if (e.target && e.target.id === 'bb-message-action' && state.undo && !state.busy) {
      var u = state.undo; state.undo = null;
      write(u.body, function () { return u.text; });
    }
  });

  // ---- Render -----------------------------------------------------------
  function render() {
    var h = '';
    h += '<section class="panel"><h2>Stores</h2><div class="sub">Switch a store off when its pages keep failing. You check it by hand, and Where to Buy says so.</div>';
    state.stores.forEach(function (s) {
      if (s.swept) {
        h += '<div class="srow"><div><b>' + esc(s.store) + '</b><span class="sub">' + (s.switched_on ? 'Checked each run' : 'Off: not in the price check, checked by hand') + '</span></div>' +
             '<button class="btn switch" type="button" data-act="switch" data-store="' + esc(s.store) + '" aria-pressed="' + s.switched_on + '"' + (state.busy ? ' disabled' : '') + '>' + (s.switched_on ? 'On' : 'Off') + '</button></div>';
      } else {
        h += '<div class="srow"><div><b>' + esc(s.store) + '</b><span class="sub">Not in the price check: a usual store only</span></div></div>';
      }
    });
    h += '</section>';

    if (!state.adding) h += '<button class="btn primary big" type="button" data-act="add-open">+ Add a page</button>';
    else h += addForm();

    if (state.rows.length === 0) {
      h += '<div class="empty">Nothing on the list yet, so the price check has nothing to read. Add a page to start.</div>';
    }
    // One group per product: its name and usual store stay in view; its store rows fold away like Where to Buy's
    // "All stores, history". A group stays open across redraws once opened, and opens for a row being edited.
    var groups = [];
    state.rows.forEach(function (r) {
      if (!groups.length || groups[groups.length - 1].upc !== r.upc) groups.push({ upc: r.upc, rows: [] });
      groups[groups.length - 1].rows.push(r);
    });
    groups.forEach(function (g) {
      var r0 = g.rows[0];
      var open = state.open[g.upc] || g.rows.some(function (r) { return r.id === state.editId; });
      h += '<div class="phead"><span class="pn">' + esc(r0.product_name) + (r0.retired ? '<span class="tag bad">Retired</span>' : '') + '</span>' +
           '<label class="sub">Usual store <select data-act="usual" data-upc="' + esc(r0.upc) + '" data-name="' + esc(r0.product_name) + '"' + (state.busy ? ' disabled' : '') + '>' + storeOptions(r0.usual_store) + '</select></label></div>';
      h += '<details class="stores" data-upc="' + esc(g.upc) + '"' + (open ? ' open' : '') + '><summary>Stores (' + g.rows.length + '): ' +
           esc(g.rows.map(function (r) { return r.store; }).join(', ')) + '</summary>' +
           g.rows.map(function (r) { return state.editId === r.id ? editForm(r) : rowHtml(r); }).join('') + '</details>';
    });
    // A redraw must never lose what was typed (a refused save keeps the form as it was).
    var keep = {};
    root.querySelectorAll('input[id], select[id]').forEach(function (el) { if (/^e-/.test(el.id)) keep[el.id] = el.value; });
    root.className = '';
    root.innerHTML = h;
    Object.keys(keep).forEach(function (id) { var el = document.getElementById(id); if (el) el.value = keep[id]; });
  }
  function storeOff(name) { var s = state.stores.filter(function (x) { return x.store === name; })[0]; return s && !s.switched_on; }
  function rowHtml(r) {
    return '<div class="lrow"><div class="nm">' + esc(r.store) + (storeOff(r.store) ? '<span class="tag">store off</span>' : '') + '</div>' +
      '<div class="meta"><a href="' + esc(r.page_url) + '" target="_blank" rel="noopener">' + esc(host(r.page_url)) + '</a> · item id ' + esc(r.store_item_id) +
      '<br>Pack: ' + esc(r.units_per_pack) + ' × ' + esc(num(r.unit_size)) + ' ' + esc(normUom(r.unit_size_uom)) + '. A page showing a different pack is skipped.' +
      (r.retired ? '<br>Retired in the catalog, so the price check skips it.' : '') + '</div>' +
      '<div class="actions"><button class="btn" type="button" data-act="edit" data-id="' + r.id + '"' + (state.busy ? ' disabled' : '') + '>Edit</button>' +
      '<button class="btn danger" type="button" data-act="off" data-id="' + r.id + '"' + (state.busy ? ' disabled' : '') + '>Turn off</button></div></div>';
  }
  function packFields(prefix, r) {
    return '<div class="grid2"><div class="field"><label for="' + prefix + 'units">Units per pack</label><select id="' + prefix + 'units">' + packOptions(r ? r.units_per_pack : 0) + '</select></div>' +
      '<div class="field"><label for="' + prefix + 'size">Unit size</label><div class="grid2"><input id="' + prefix + 'size" inputmode="decimal" value="' + esc(r ? num(r.unit_size) : '') + '">' +
      '<select id="' + prefix + 'uom">' + uomOptions(r ? r.unit_size_uom : '') + '</select></div></div></div>' +
      '<div class="hint">How many things you sell in what you buy. A 6-pack of bottles is 6. A Sam\'s case of 48 bars is 48. The price check skips a page whose count or size differs.</div>';
  }
  function editForm(r) {
    return '<div class="lrow"><div class="nm">' + esc(r.store) + '</div>' +
      '<div class="field"><label for="e-url">Product page</label><input id="e-url" value="' + esc(r.page_url) + '"></div>' +
      '<div class="field"><label for="e-id">Store item id</label><input id="e-id" value="' + esc(r.store_item_id) + '"></div>' + packFields('e-', r) +
      '<div class="hint">A new page link or item id keeps this row. A new units per pack or unit size starts a new row, and this one keeps its price history.</div>' +
      '<div class="actions"><button class="btn" type="button" data-act="edit-cancel">Cancel</button>' +
      '<button class="btn primary" type="button" id="e-save" data-act="edit-save" data-id="' + r.id + '"' + (state.editDirty && !state.busy ? '' : ' disabled') + '>Save</button></div></div>';
  }
  function addForm() {
    var h = '<section class="panel"><h2>Add a page</h2>';
    if (!state.pick) {
      var picks = '';
      if (state.products && state.filter.length >= 2) {
        var f = state.filter.toLowerCase();
        var found = state.products.filter(function (p) { return p.product_name.toLowerCase().indexOf(f) >= 0 || String(p.upc).indexOf(f) >= 0; }).slice(0, 12);
        picks = '<div class="picks">' + (found.length ? found.map(function (p) {
          return '<button type="button" data-act="pick" data-upc="' + esc(p.upc) + '" data-name="' + esc(p.product_name) + '">' + esc(p.product_name) + ' <span class="sub">' + esc(p.upc) + '</span></button>';
        }).join('') : '<div class="sub" style="padding:0.6rem">No product matches. Add it to the catalog first.</div>') + '</div>';
      }
      return h + '<div class="field"><label for="a-prod">Product</label><input id="a-prod" autocomplete="off" placeholder="' + (state.products ? 'Type 2 or more letters of the name, or the UPC' : 'Loading products…') + '" value="' + esc(state.filter) + '">' + picks +
        '<div class="hint">From the basement catalog.</div></div><div class="actions"><button class="btn" type="button" data-act="add-cancel">Cancel</button></div></section>';
    }
    var a = state.add, rows = rowsFor(state.pick.upc), left = storesLeft(state.pick.upc);
    h += '<div class="picked">' + esc(state.pick.name) + ' <button class="btn" type="button" data-act="unpick">Change</button></div>';
    h += '<div class="sub">' + (rows.length ? 'On the list at ' + rows.map(function (r) { return esc(r.store) + ' (' + esc(r.units_per_pack) + ' × ' + esc(num(r.unit_size)) + ' ' + esc(normUom(r.unit_size_uom)) + ')'; }).join(', ') + '.' : 'Not on the list yet.') + '</div>';
    if (!a.store) {
      return h + '<div class="done">On the list at every store the price check reads.</div><div class="actions"><button class="btn" type="button" data-act="add-cancel">Done</button>' +
        '<button class="btn" type="button" data-act="unpick">Add another product</button></div></section>';
    }
    var swept = state.stores.filter(function (x) { return x.swept; }).map(function (x) { return x.store; });
    var order = ADD_ORDER.filter(function (x) { return swept.indexOf(x) >= 0; }).concat(swept.filter(function (x) { return ADD_ORDER.indexOf(x) < 0; }));
    h += '<div class="field"><label>Store</label><div class="chips">' + order.map(function (x) {
      var on = left.indexOf(x) < 0;
      return '<button class="chip" type="button" data-act="add-store" data-store="' + esc(x) + '" aria-pressed="' + (x === a.store) + '"' + (on ? ' disabled title="Already on the list"' : '') + '>' + esc(x) + '</button>';
    }).join('') + '</div>' + (storeOff(a.store) ? '<div class="hint">' + esc(a.store) + ' is switched off, so this row waits until it\'s on.</div>' : '') + '</div>';
    var it = readItem(a.store, a.item), spec = ITEM[a.store] || { label: 'Store item id', ph: '' };
    h += '<div class="field"><label for="a-item">' + esc(spec.label) + '</label><input id="a-item" autocomplete="off" placeholder="' + esc(spec.ph) + '" value="' + esc(a.item) + '">';
    if (a.store === 'Kroger') {
      var want = krogerId(state.pick.upc);
      // A different id isn't refused: a store can sell another package of the same product under its own UPC
      // (Mountain Dew 6 pk is 012000504082, an alias of the catalog's 012000344985). The worker still checks the page's
      // item id, count and size against the row on every run.
      h += '<div class="hint">Kroger needs its full link. From the UPC its item id would be ' + want + '.</div>' +
        (a.item ? (!it.id ? '<div class="built bad">That isn\'t a Kroger product link.</div>'
          : it.id === want ? '<div class="built ok">Item id ' + it.id + ' matches the UPC.</div>'
          : '<div class="built warn">This link is item ' + esc(it.id) + ', not ' + want + '. That\'s fine if Kroger sells this pack under its own UPC: open the link and check it\'s ' + esc(state.pick.name) + ', then save.</div>') : '');
    } else {
      h += it.link ? '<div class="built">Link: <a href="' + esc(it.link) + '" target="_blank" rel="noopener">' + esc(it.link) + '</a> · open it to check</div>' : '<div class="hint">The link is built from this.</div>';
    }
    h += '</div>';
    h += '<div class="grid2"><div class="field"><label for="a-units">Units per pack</label><select id="a-units">' + packOptions(a.units) + '</select></div>' +
      '<div class="field"><label for="a-size">Unit size</label><div class="grid2"><input id="a-size" inputmode="decimal" value="' + esc(a.size) + '">' +
      '<select id="a-uom">' + uomOptions(a.uom) + '</select></div></div></div>' +
      '<div class="hint">' + esc(a.from) + (a.store === "Sam's" ? ' Sam\'s sells cases: set the units per pack to the case count.' : '') + '</div>';
    var next = left.filter(function (x) { return x !== a.store; })[0];
    h += '<div class="actions"><button class="btn" type="button" data-act="add-cancel">Cancel</button>' +
      '<button class="btn" type="button" data-act="add-save"' + (state.busy ? ' disabled' : '') + '>Save</button>' +
      (next ? '<button class="btn primary next" type="button" data-act="add-next"' + (state.busy ? ' disabled' : '') + '>Save and add ' + esc(next) + ' &rarr;</button>' : '') + '</div></section>';
    return h;
  }

  // ---- Actions ------------------------------------------------------------
  function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
  function packFrom(prefix) { return { units_per_pack: Number(val(prefix + 'units')), unit_size: Number(val(prefix + 'size')), unit_size_uom: val(prefix + 'uom') }; }
  function rowById(id) { return state.rows.filter(function (r) { return String(r.id) === String(id); })[0]; }

  // Remember which product groups are open, so a redraw after a save doesn't fold them back up.
  root.addEventListener('toggle', function (e) {
    if (e.target.matches && e.target.matches('details.stores')) state.open[e.target.getAttribute('data-upc')] = e.target.open;
  }, true);
  root.addEventListener('input', function (e) {
    if (e.target.id === 'a-prod') {
      state.filter = e.target.value;
      var pos = e.target.selectionStart;
      render();
      var el = document.getElementById('a-prod'); if (el) { el.focus(); el.setSelectionRange(pos, pos); }
    }
    if (e.target.id === 'a-item' && state.add) {
      state.add.item = e.target.value;
      var p2 = e.target.selectionStart;
      render();
      var it = document.getElementById('a-item'); if (it) { it.focus(); it.setSelectionRange(p2, p2); }
    }
    if (e.target.id === 'a-size' && state.add) state.add.size = e.target.value;
    if (state.editId && /^e-/.test(e.target.id)) { state.editDirty = true; document.getElementById('e-save').disabled = state.busy; }
  });
  root.addEventListener('change', function (e) {
    var t = e.target;
    if (state.add && t.id === 'a-units') state.add.units = Number(t.value) || 0;
    if (state.add && t.id === 'a-size') state.add.size = t.value;
    if (state.add && t.id === 'a-uom') state.add.uom = t.value;
    if (state.editId && /^e-/.test(t.id)) { state.editDirty = true; document.getElementById('e-save').disabled = state.busy; }
    if (t.getAttribute('data-act') === 'usual') {
      var name = t.getAttribute('data-name'), store = t.value;
      write({ operation: 'set_usual', upc: t.getAttribute('data-upc'), usual_store: store }, function () { return 'Usual store for ' + name + ': ' + store + '.'; });
    }
  });
  root.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.tagName === 'SELECT' || state.busy) return;
    var act = b.getAttribute('data-act');
    if (act === 'switch') {
      var store = b.getAttribute('data-store'), on = b.getAttribute('aria-pressed') !== 'true';
      write({ operation: 'set_store', store: store, switched_on: on }, function () { return store + (on ? ' is on: checked each run.' : ' is off: check it by hand.'); }, null,
        { body: { operation: 'set_store', store: store, switched_on: !on }, text: store + ' is ' + (on ? 'off' : 'on') + ' again.' });
    } else if (act === 'add-open') {
      state.adding = true; state.pick = null; state.add = null; state.filter = ''; render();
      loadProducts().then(render).catch(function (err) { BBMessages.show('error', 'Couldn\'t load the product catalog. Reload the page to try again.', { why: err.message }); });
    } else if (act === 'add-cancel') {
      state.adding = false; render();
    } else if (act === 'pick') {
      state.pick = { upc: b.getAttribute('data-upc'), name: b.getAttribute('data-name') }; state.add = startAdd(state.pick); render();
    } else if (act === 'unpick') {
      state.pick = null; state.add = null; state.filter = ''; render();
    } else if (act === 'add-store') {
      state.add.store = b.getAttribute('data-store'); state.add.item = ''; render();
    } else if (act === 'add-save' || act === 'add-next') {
      var a = state.add, it = readItem(a.store, a.item), pick = state.pick, goNext = act === 'add-next';
      if (!it.id || !it.link) { BBMessages.show('error', 'Nothing changed. ' + (a.store === 'Kroger' ? 'Paste the Kroger product page link.' : 'Type the ' + ITEM[a.store].label.toLowerCase() + ', or paste the link.')); return; }
      var body = { operation: 'create', upc: pick.upc, store: a.store, page_url: it.link, store_item_id: it.id, units_per_pack: Number(a.units), unit_size: Number(a.size), unit_size_uom: a.uom };
      var label = pick.name + ' at ' + a.store, keep = { units: a.units, size: a.size, uom: a.uom };
      write(body, function (changed) {
        var back = changed && changed[0] && changed[0].result === 'turned_on';
        var next = goNext && state.add && state.add.store ? ' Next: ' + state.add.store + '.' : '';
        return (back ? label + ' is back on the list, with its price history.' : label + ' added.') + next;
      }, function () {
        state.open[pick.upc] = true;
        if (goNext) state.add = startAdd(pick, keep);
        else { state.adding = false; state.pick = null; state.add = null; state.filter = ''; }
      });
    } else if (act === 'edit') {
      state.editId = Number(b.getAttribute('data-id')); state.editDirty = false; render();
    } else if (act === 'edit-cancel') {
      state.editId = null; render();
    } else if (act === 'edit-save') {
      var r = rowById(b.getAttribute('data-id'));
      var eb = Object.assign({ operation: 'update', list_id: r.id, page_url: val('e-url'), store_item_id: val('e-id') }, packFrom('e-'));
      write(eb, function (changed) {
        var res = changed && changed[0] && changed[0].result;
        return r.product_name + ' at ' + r.store + (res === 'updated' ? ' saved.' : ': new pack saved as a new row; the old one keeps its history.');
      }, function () { state.editId = null; });
    } else if (act === 'off') {
      var x = rowById(b.getAttribute('data-id'));
      write({ operation: 'turn_off', list_id: x.id }, function () { return x.product_name + ' at ' + x.store + ' turned off. Its price history is kept.'; }, null,
        { body: { operation: 'create', upc: x.upc, store: x.store, page_url: x.page_url, store_item_id: x.store_item_id, units_per_pack: x.units_per_pack, unit_size: Number(x.unit_size), unit_size_uom: x.unit_size_uom },
          text: x.product_name + ' at ' + x.store + ' is back on the list.' });
    }
  });

  load().then(render).catch(function (err) {
    root.className = 'empty';
    root.textContent = '';
    BBMessages.show('error', 'Couldn\'t load the list. Reload the page to try again.', { why: err.message });
  });
})();
</script>
</body>
</html>
