<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pick List (v1.5)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      padding: 10px;
    }

    .container { max-width: 500px; margin: 0 auto; }

    .header { text-align: center; margin-bottom: 15px; }
    .header h1 { font-size: 1.3rem; color: #333; margin-bottom: 4px; }
    .header .meta {
      font-size: 1.15rem;
      font-weight: 700;
      color: #4472C4;
      margin-top: 2px;
    }

    .category-header {
      font-size: 0.95rem;
      font-weight: 700;
      color: #4472C4;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin: 18px 0 8px;
      padding-bottom: 4px;
      border-bottom: 2px solid #4472C4;
    }
    
    .item-row {
      background: white;
      border-radius: 10px;
      margin-bottom: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .item-collapsed {
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .item-collapsed.stockout { background: #fff3f3; }
    .item-info { flex: 1; }
    .item-name { font-weight: 600; font-size: 0.95rem; color: #333; }
    .item-name.stockout { color: #C0392B; }
    .item-sub { font-size: 0.82rem; color: #777; margin-top: 2px; }
    .item-check { font-size: 1.3rem; color: #548235; margin-left: 10px; flex-shrink: 0; }

    .item-expanded { padding: 14px; border-top: 1px solid #eee; background: #fafafa; }

    .stepper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .stepper-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      background: #ddd;
    }

    .stepper-qty { font-size: 1.8rem; font-weight: 700; min-width: 50px; text-align: center; }

    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-pick { background: #548235; color: white; }
    .btn-unpick { background: #C65911; color: white; }

    .review-row {
      background: white;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      font-weight: 600;
    }
    
    .review-actions { display: flex; gap: 10px; margin-top: 15px; }
    .review-actions .btn { flex: 1; }
    
    .picked-label {
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
      color: #155724;
      margin-bottom: 10px;
    }

    .loading, .empty-state { text-align: center; padding: 30px; color: #666; }

    .error-banner {
      background: #f8d7da;
      color: #721c24;
      padding: 14px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 15px;
    }

    .date-warning-banner {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
      padding: 12px 14px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .carryover-banner {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
      padding: 12px 14px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .carryover-note {
      font-size: 0.82rem;
      font-weight: 600;
      color: #b45309;
      margin-top: 2px;
    }

    .btn-reset {
      background: white;
      color: #C0392B;
      border: 2px solid #C0392B;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-box {
      background: white;
      border-radius: 10px;
      padding: 20px;
      max-width: 380px;
      width: 100%;
    }

    .modal-box h3 { margin-bottom: 10px; font-size: 1.1rem; }
    .modal-box p { margin-bottom: 16px; color: #555; font-size: 0.9rem; }
    .modal-actions { display: flex; gap: 10px; }
    .modal-actions .btn { flex: 1; margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="container">
    <div id="dateWarningBanner" class="date-warning-banner" style="display:none;"></div>
    <div id="resetErrorBanner" class="error-banner" style="display:none;"></div>
    <div class="header" id="header"></div>
    <button class="btn btn-reset" id="resetBtnTop" onclick="openResetModal()" style="display:none;">Reset Session</button>
    <div id="content" class="loading">Loading pick list...</div>
  </div>
  <button class="btn" id="endSessionBtn" onclick="openReviewScreen()"
    style="background:#888;color:white;margin-top:5px;display:none;">End Session</button>
  <button class="btn btn-reset" id="resetBtnBottom" onclick="openResetModal()" style="margin-top:5px;display:none;">Reset Session</button>

  <div class="modal-overlay" id="resetModalOverlay">
    <div class="modal-box">
      <h3>Reset Session?</h3>
      <p>This will clear all picks for today's session. Items already packed into bags will need to be re-picked.</p>
      <div class="modal-actions">
        <button class="btn" style="background:#888;color:white;" onclick="closeResetModal()">Cancel</button>
        <button class="btn btn-reset" onclick="confirmReset()">Reset Session</button>
      </div>
    </div>
  </div>

  <script src="/shared/config.js"></script>
  <script>
    var READ_URL = 'https://randysmith42.app.n8n.cloud/webhook/pick-list';
    var WRITE_URL = 'https://randysmith42.app.n8n.cloud/webhook/pick-list/pick';
    var FINALIZE_URL = 'https://randysmith42.app.n8n.cloud/webhook/pick-list/finalize';
    var RESET_URL = 'https://randysmith42.app.n8n.cloud/webhook/pick-list/reset';

    var params = new URLSearchParams(window.location.search);
    var locationParam = params.get('location');
    var dateParam = params.get('date');
    var modeParam = params.get('mode');

    // Normalize to ISO (YYYY-MM-DD) immediately, regardless of which format
    // the email link used. The backend's date guard and the Finalize
    // carryover math both compare/parse this as ISO — a raw MM-DD-YY value
    // sorts before an ISO string and gets misread as a past date even when
    // it's genuinely today.
    (function normalizeDateParam() {
      var parsed = parseDateParam(dateParam);
      if (parsed) {
        var yyyy = parsed.getFullYear();
        var mm = String(parsed.getMonth() + 1).padStart(2, '0');
        var dd = String(parsed.getDate()).padStart(2, '0');
        dateParam = yyyy + '-' + mm + '-' + dd;
      }
    })();

    var items = [];
    var itemState = {};
    var hasPriorSession = false;
    var isToday = true;

    function capitalize(s) {
      if (!s) return '';
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    function init() {
      if (!locationParam || !dateParam || !modeParam) {
        document.getElementById('content').innerHTML =
          '<div class="error-banner">Missing required parameters. This page needs location, date, and mode in the URL.</div>';
        return;
      }

      var parsedDate = parseDateParam(dateParam);
      var today = new Date();
      today.setHours(0, 0, 0, 0);
      if (parsedDate) parsedDate.setHours(0, 0, 0, 0);

      if (parsedDate && !isSameDate(parsedDate, today)) {
        var banner = document.getElementById('dateWarningBanner');
        banner.textContent = '⚠ This pick list is for ' + dateParam + ', not today.';
        banner.style.display = 'block';
      }
      isToday = !parsedDate || isSameDate(parsedDate, today);
      
      document.getElementById('header').innerHTML =
        '<h1>📋 ' + capitalize(locationParam) + ' Pick List (v1.5)</h1>' +
        '<div class="meta" id="metaLine">' + dateParam + ' — ' + (modeParam === 'light' ? 'Light Stock' : 'Full Stock') + '</div>';

      loadPickList()
        .then(function() { render(); })
        .catch(function(err) {
          document.getElementById('content').innerHTML =
            '<div class="error-banner">Error loading pick list: ' + err.message + '</div>';
        });
    }

    function parseDateParam(str) {
      var iso = str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (iso) return new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]));
      var mdy = str.match(/^(\d{2})-(\d{2})-(\d{2})$/);
      if (mdy) return new Date(2000 + Number(mdy[3]), Number(mdy[1]) - 1, Number(mdy[2]));
      return null;
    }

    function isSameDate(a, b) {
      return a && b && a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }
    
    function loadPickList() {
      var url = READ_URL + '?location=' + encodeURIComponent(locationParam) +
        '&date=' + encodeURIComponent(dateParam) +
        '&mode=' + encodeURIComponent(modeParam);
      return fetch(url, { headers: { 'X-API-Key': API_KEY } })
        .then(function(r) { return r.json().then(function(body) { return { ok: r.ok, body: body }; }); })
        .then(function(result) {
          if (!result.ok) {
            throw new Error(result.body.error || 'Request failed');
          }
          var payload = Array.isArray(result.body) ? result.body[0] : result.body;
          items = payload.items || [];
          hasPriorSession = payload.has_prior_session === true;
          items.forEach(function(item) {
            itemState[item.upc] = { expanded: false, touched: false, qty: 0 };
          });
        });
    }

    // on_hand now comes straight off each pick_list item — Pick List — Read
    // joins basement_inventory (alias-resolved) server-side. No separate
    // fetch needed; this used to hit the old Apps Script getProducts action
    // directly, which stopped reflecting reality the moment writes moved to
    // Neon. That was the actual bug: not a missing field, a second stale
    // data source the page never stopped calling.
    function getOnHand(upc) {
      var item = findItem(upc);
      var qty = item ? item.on_hand : undefined;
      return (qty === undefined || qty === null) ? '—' : qty;
    }

    function findItem(upc) {
      for (var i = 0; i < items.length; i++) {
        if (items[i].upc === upc) return items[i];
      }
      return null;
    }

    function render() {
      var container = document.getElementById('content');
      var total = items.length;
      var metaEl = document.getElementById('metaLine');
      if (metaEl) {
        metaEl.textContent = dateParam + ' — ' + (modeParam === 'light' ? 'Light Stock' : 'Full Stock') + ' — ' + total + (total === 1 ? ' Item' : ' Items');
      }
      
      if (items.length === 0) {
        if (metaEl) metaEl.textContent = dateParam + ' — ' + (modeParam === 'light' ? 'Light Stock' : 'Full Stock') + ' — 0 Items';
          document.getElementById('endSessionBtn').style.display = 'none';
          document.getElementById('resetBtnTop').style.display = 'none';
          document.getElementById('resetBtnBottom').style.display = 'none';
          container.innerHTML = '<div class="empty-state">No items for this location and date.</div>';
        return;
      }

      var byCategory = {};
      items.forEach(function(item) {
        var cat = item.pick_category || 'Other';
        if (!byCategory[cat]) byCategory[cat] = [];
        byCategory[cat].push(item);
      });

      var categories = Object.keys(byCategory).sort();
      categories.forEach(function(cat) {
        byCategory[cat].sort(function(a, b) { return a.product_name.localeCompare(b.product_name); });
      });

      var html = '';
      if (hasPriorSession) {
        html += '<div class="carryover-banner">📦 Yesterday\'s session has undelivered picks. Quantities in bags are shown on each item.</div>';
      }
      categories.forEach(function(cat) {
        html += '<div class="category-header">' + cat + ' — ' + byCategory[cat].length + '</div>';
        byCategory[cat].forEach(function(item) { html += renderItem(item); });
      });

      container.innerHTML = html;
      document.getElementById('endSessionBtn').style.display = 'block';
      var showReset = isToday ? 'block' : 'none';
      document.getElementById('resetBtnTop').style.display = showReset;
      document.getElementById('resetBtnBottom').style.display = showReset;
    }

    function renderItem(item) {
      var state = itemState[item.upc];
      var isPicked = item.picked === true;
      var isSkipped = item.skipped === true;
      var onHand = getOnHand(item.upc);
      var stockoutClass = item.is_stockout ? ' stockout' : '';
      var skippedStyle = isSkipped ? ' style="opacity:0.5;"' : '';
      var priorQtyPicked = item.prior_qty_picked || 0;
      var carryoverHtml = '';
      if (priorQtyPicked > 0) {
        var stillNeeded = Math.max(item.bring_qty - priorQtyPicked, 0);
        carryoverHtml = '<div class="carryover-note">In bags: ' + priorQtyPicked + ' &nbsp;\u00b7&nbsp; Still needed: ' + stillNeeded + '</div>';
      }

      var collapsedHtml =
        '<div class="item-collapsed' + stockoutClass + '"' + skippedStyle + ' onclick="toggleExpand(\'' + item.upc + '\')">' +
          '<div class="item-info">' +
            '<div class="item-name' + stockoutClass + '">' + item.product_name + '</div>' +
            carryoverHtml +
            '<div class="item-sub">Bring: ' + item.bring_qty + ' &nbsp;|&nbsp; On hand: ' + onHand + (isSkipped ? ' &nbsp;|&nbsp; SKIPPED' : '') + '</div>' +
          '</div>' +
          (isPicked ? '<div class="item-check">✓</div>' : '') +
        '</div>';

      var expandedHtml = '';
      if (state.expanded) {
        if (isPicked) {
          expandedHtml =
            '<div class="item-expanded">' +
              '<div class="picked-label">Picked — ' + item.qty_picked + '</div>' +
              '<button class="btn btn-unpick" onclick="handleUnpick(\'' + item.upc + '\')">Unpick</button>' +
            '</div>';
        } else if (isSkipped) {
          expandedHtml =
            '<div class="item-expanded">' +
              '<div class="picked-label" style="color:#888;">Skipped</div>' +
              '<button class="btn btn-unpick" onclick="handleUnskip(\'' + item.upc + '\')">Unskip</button>' +
            '</div>';
        } else {
          expandedHtml =
            '<div class="item-expanded">' +
              '<div class="stepper">' +
                '<button class="stepper-btn" onclick="adjustStepper(\'' + item.upc + '\', -1)">−</button>' +
                '<div class="stepper-qty" id="stepperQty-' + item.upc + '">' + state.qty + '</div>' +
                '<button class="stepper-btn" onclick="adjustStepper(\'' + item.upc + '\', 1)">+</button>' +
              '</div>' +
              '<button class="btn btn-pick" id="pickBtn-' + item.upc + '" ' +
                (state.touched ? '' : 'disabled') +
                ' onclick="handlePick(\'' + item.upc + '\')">Pick</button>' +
              '<button class="btn" style="background:#888;color:white;" onclick="handleSkip(\'' + item.upc + '\')">Skip</button>' +
            '</div>';
        }
      }

      return '<div class="item-row">' + collapsedHtml + expandedHtml + '</div>';
    }

    function toggleExpand(upc) {
      var item = findItem(upc);
      if (item.picked) {
        if (window.confirm('Undo pick?')) submitPick(upc, 'unpick', 0);
        return;
      }
      if (item.skipped) {
        if (window.confirm('Unskip?')) submitPick(upc, 'unskip', 0);
        return;
      }
      itemState[upc].expanded = !itemState[upc].expanded;
      render();
    }

    function adjustStepper(upc, delta) {
      var state = itemState[upc];
      state.touched = true;
      state.qty = Math.max(0, state.qty + delta);
      document.getElementById('stepperQty-' + upc).textContent = state.qty;
      var btn = document.getElementById('pickBtn-' + upc);
      if (btn) btn.disabled = false;
    }

    function handlePick(upc) {
      var item = findItem(upc);
      var state = itemState[upc];

      if (state.qty === 0 && item.is_stockout) {
        if (!window.confirm('This item is stocked out — pick nothing?')) return;
      }

      submitPick(upc, 'pick', state.qty);
    }

    function handleUnpick(upc) {
      if (window.confirm('Undo pick?')) submitPick(upc, 'unpick', 0);
    }

    function handleSkip(upc) {
      submitPick(upc, 'skip', 0);
    }

    function handleUnskip(upc) {
      submitPick(upc, 'unskip', 0);
    }

    function openResetModal() {
      document.getElementById('resetModalOverlay').style.display = 'flex';
    }

    function closeResetModal() {
      document.getElementById('resetModalOverlay').style.display = 'none';
    }

    function confirmReset() {
      fetch(RESET_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
        body: JSON.stringify({ location: locationParam, date: dateParam })
      })
        .then(function(r) { return r.json().then(function(body) { return { ok: r.ok, body: body }; }); })
        .then(function(result) {
          if (result.ok) {
            window.location.reload();
          } else {
            closeResetModal();
            var msg = (result.body && result.body.error)
              ? result.body.error + (result.body.details && result.body.details.length ? ': ' + result.body.details.join(', ') : '')
              : 'Reset failed.';
            var banner = document.getElementById('resetErrorBanner');
            banner.textContent = msg;
            banner.style.display = 'block';
          }
        })
        .catch(function(err) {
          closeResetModal();
          var banner = document.getElementById('resetErrorBanner');
          banner.textContent = 'Network error: ' + err.message;
          banner.style.display = 'block';
        });
    }

    function submitPick(upc, action, qty) {
      var body = { location: locationParam, date: dateParam, upc: upc, action: action };
      if (action === 'pick') body.qty_picked = qty;

      fetch(WRITE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
        body: JSON.stringify(body)
      })
        .then(function(r) { return r.json().then(function(resBody) { return { ok: r.ok, status: r.status, body: resBody }; }); })
        .then(function(result) {
          if (result.ok && result.body.status === 'ok') {
            var item = findItem(upc);
            item.picked = result.body.picked;
            item.qty_picked = result.body.qty_picked;
            item.skipped = result.body.skipped;
            itemState[upc].touched = false;
            itemState[upc].qty = 0;
            itemState[upc].expanded = (action === 'unpick' || action === 'unskip');
            render();
          } else if (result.status === 409) {
            itemState[upc].expanded = false;
            render();
            alert('This session is from a previous day and can no longer be modified.');
          } else {
            alert('Error: ' + (result.body && result.body.error ? result.body.error : 'unknown error'));
          }
        })
        .catch(function(err) { alert('Network error: ' + err.message); });
    }

    function openReviewScreen() {
      var unpickedByCategory = {};
      items.forEach(function(item) {
        if (!item.picked) { 
          var cat = item.pick_category || 'Other';
          if (!unpickedByCategory[cat]) unpickedByCategory[cat] = [];
          unpickedByCategory[cat].push(item);
        }
      });

      var categories = Object.keys(unpickedByCategory).sort();
      categories.forEach(function(cat) {
        unpickedByCategory[cat].sort(function(a, b) { return a.product_name.localeCompare(b.product_name); });
      });

      var rowsHtml = categories.length === 0
        ? '<p style="text-align:center;color:#548235;font-weight:600;">All items picked!</p>'
      : categories.map(function(cat) {
          var itemList = unpickedByCategory[cat].map(function(item) {
            var stockoutTag = item.is_stockout ? ' <span style="color:#C0392B;font-weight:700;">STOCKOUT</span>' : '';
            return '<div style="padding:6px 0 6px 14px;font-size:0.88rem;font-weight:400;color:#555;border-top:1px solid #eee;">' +
              item.product_name + stockoutTag + '</div>';
          }).join('');
          return '<div class="review-row" style="flex-direction:column;align-items:stretch;">' +
            '<div style="display:flex;justify-content:space-between;">' +
              '<span>' + cat + '</span><span>' + unpickedByCategory[cat].length + ' unpicked</span>' +
            '</div>' + itemList +
          '</div>';
        }).join('');

    document.getElementById('content').innerHTML =
      '<h2 style="margin-bottom:12px;">Review</h2>' + rowsHtml +
      '<div class="review-actions">' +
        '<button class="btn" style="background:#888;color:white;" onclick="render()">Go Back</button>' +
        '<button class="btn btn-pick" onclick="finalizeSession()">Done</button>' +
      '</div>';
    document.getElementById('endSessionBtn').style.display = 'none';
}

function finalizeSession() {
  document.getElementById('content').innerHTML = '<div class="loading">Sending shopping list...</div>';
  fetch(FINALIZE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
    body: JSON.stringify({ location: locationParam, date: dateParam, mode: modeParam })
    })
    .then(function(r) { return r.json().then(function(body) { return { ok: r.ok, body: body }; }); })
    .then(function(result) {
      if (!result.ok) {
        throw new Error(result.body.error || result.body.message || 'Finalize failed');
      }
      document.getElementById('content').innerHTML =
        '<div class="empty-state">Session closed. Shopping list sent.</div>';
      })
    .catch(function(err) {
      document.getElementById('content').innerHTML =
        '<div class="error-banner">Error sending shopping list: ' + err.message + '</div>';
      });
  }

    init();
  </script>
</body>
</html>
