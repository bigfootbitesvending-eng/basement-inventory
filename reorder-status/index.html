<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bigfoot Bites — Reorder Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/styles.css">
<style>
  /* The hidden attribute is only display:none in the browser's default
     stylesheet, so any class below that sets its own display value (flex,
     grid, etc.) silently wins over it. This rule forces hidden to always
     win, regardless of what a class declares. */
  [hidden] { display: none !important; }

  /* Don't reorder has its own color: the shared palette has no slate, and Low sales already uses the warm grey. */
  :root { --status-off: #4A6A8A; }

  main { max-width: 680px; margin: 0 auto; padding: 2.5rem 1.1rem 4rem; }

  header { margin-bottom: 1.25rem; border-bottom: 2px solid var(--ink); padding-bottom: 1rem; }
  .breadcrumb { display: inline-block; font-size: 0.8rem; color: var(--ink-soft); text-decoration: none; margin-bottom: 0.6rem; }
  .breadcrumb:hover { color: var(--ledger-green); }
  .breadcrumb:focus-visible { outline: 2px solid var(--ledger-green); outline-offset: 2px; }
  h1 { font-size: 1.6rem; margin: 0 0 0.25rem; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 1.25rem; }
  .subtitle { color: var(--ink-soft); font-size: 0.85rem; }

  .refresh-btn {
    font-family: var(--font-body); font-weight: 600; font-size: 0.85rem;
    background: #fff; border: 1px solid var(--rule); border-radius: 6px;
    padding: 0.5rem 0.95rem; color: var(--ledger-green); cursor: pointer;
    flex: 0 0 auto;
  }
  .refresh-btn:hover { background: var(--ledger-green-soft); }
  .refresh-btn:disabled { opacity: 0.5; cursor: default; background: #fff; }
  .refresh-btn:focus-visible { outline: 2px solid var(--ledger-green); outline-offset: 2px; }

  .view-toggle { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  .view-btn {
    flex: 1; font-family: var(--font-body); font-weight: 600; font-size: 0.9rem;
    background: #fff; border: 1px solid var(--rule); border-radius: 6px;
    padding: 0.65rem; color: var(--ink-soft); cursor: pointer;
  }
  .view-btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .view-btn:focus-visible { outline: 2px solid var(--ledger-green); outline-offset: 2px; }

  .filter-wrap { position: relative; margin-bottom: 0.75rem; }
  .filter-input {
    width: 100%; box-sizing: border-box; font-family: var(--font-body); font-size: 0.9rem;
    padding: 0.6rem 2.2rem 0.6rem 0.8rem; border: 1px solid var(--rule); border-radius: 6px;
    background: #fff; color: var(--ink);
  }
  .filter-input:focus-visible { outline: 2px solid var(--ledger-green); outline-offset: 1px; }
  .filter-clear {
    position: absolute; right: 0.4rem; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--status-error); font-size: 1.2rem;
    font-weight: 700; line-height: 1; cursor: pointer; padding: 0.25rem 0.4rem;
  }
  .filter-clear:focus-visible { outline: 2px solid var(--ledger-green); outline-offset: 2px; }

  .status-filter-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .status-chip {
    font-family: var(--font-body); font-weight: 600; font-size: 0.8rem;
    background: #fff; border: 1px solid var(--rule); border-radius: 999px;
    padding: 0.4rem 0.85rem; color: var(--ink-soft); cursor: pointer;
  }
  .status-chip:focus-visible { outline: 2px solid var(--ledger-green); outline-offset: 2px; }
  .status-chip[aria-pressed="true"][data-status="critical"] { background: var(--status-error-soft); border-color: var(--status-error); color: var(--ink); }
  .status-chip[aria-pressed="true"][data-status="warning"] { background: var(--status-draft-soft); border-color: var(--status-draft); color: var(--ink); }
  .status-chip[aria-pressed="true"][data-status="fine"] { background: var(--ledger-green-soft); border-color: var(--ledger-green); color: var(--ink); }
  .status-chip[aria-pressed="true"][data-status="low_sales"] { background: color-mix(in srgb, var(--status-not-started) 22%, var(--paper)); border-color: var(--status-not-started); color: var(--ink); }
  .status-chip[aria-pressed="true"][data-status="reorder_off"] { background: color-mix(in srgb, var(--status-off) 16%, var(--paper)); border-color: var(--status-off); color: var(--ink); }

  .chip-bar { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem; margin-bottom: 1rem; }
  .chip-bar::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; font-family: var(--font-body); font-weight: 600; font-size: 0.82rem;
    background: #fff; border: 1px solid var(--rule); border-radius: 999px;
    padding: 0.45rem 0.95rem; color: var(--ink-soft); cursor: pointer; white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--ledger-green); border-color: var(--ledger-green); color: #fff; }
  .chip:focus-visible { outline: 2px solid var(--ledger-green); outline-offset: 2px; }

  .row-list { display: flex; flex-direction: column; gap: 0.7rem; }
  .row-card {
    background: #fff; border: 1px solid var(--rule); border-left: 4px solid var(--rule);
    border-radius: 6px; padding: 0.95rem 1.1rem;
  }
  .row-card[data-status="critical"] { border-left-color: var(--status-error); }
  .row-card[data-status="warning"] { border-left-color: var(--status-draft); }
  .row-card[data-status="fine"] { border-left-color: var(--ledger-green); }
  .row-card[data-status="low_sales"] { border-left-color: var(--status-not-started); }
  .row-card[data-status="reorder_off"] { border-left-color: var(--status-off); }

  .row-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; }
  .row-name { font-family: var(--font-display); font-weight: 700; font-size: 1rem; line-height: 1.25; }
  .row-category { color: var(--ink-soft); font-size: 0.78rem; margin-top: 0.15rem; }

  .badge {
    display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.75rem; font-weight: 600;
    padding: 0.28rem 0.6rem; border-radius: 999px; white-space: nowrap; flex: 0 0 auto; color: var(--ink);
  }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .badge[data-status="critical"] { background: var(--status-error-soft); }
  .badge[data-status="critical"] .dot { background: var(--status-error); }
  .badge[data-status="warning"] { background: var(--status-draft-soft); }
  .badge[data-status="warning"] .dot { background: var(--status-draft); }
  .badge[data-status="fine"] { background: var(--ledger-green-soft); }
  .badge[data-status="fine"] .dot { background: var(--ledger-green); }
  .badge[data-status="low_sales"] { background: color-mix(in srgb, var(--status-not-started) 22%, var(--paper)); }
  .badge[data-status="low_sales"] .dot { background: var(--status-not-started); }
  .badge[data-status="reorder_off"] { background: color-mix(in srgb, var(--status-off) 16%, var(--paper)); }
  .badge[data-status="reorder_off"] .dot { background: var(--status-off); }

  .row-stats { display: flex; flex-wrap: wrap; gap: 0.6rem 1.2rem; margin-top: 0.65rem; }
  .stat { min-width: 4.5rem; }
  .stat-label { color: var(--ink-soft); font-size: 0.72rem; display: block; }
  .stat-value { font-weight: 600; font-size: 0.88rem; }

  .trend-toggle {
    display: block; width: 100%; text-align: left; background: none;
    border: none; border-top: 1px dashed var(--rule);
    padding: 0.6rem 0 0; margin-top: 0.6rem; font-size: 0.78rem;
    color: var(--ledger-green); font-weight: 600; cursor: pointer; text-decoration: underline;
  }
  .trend-toggle:focus-visible { outline: 2px solid var(--ledger-green); outline-offset: 2px; }
  .trend-line { font-size: 0.8rem; color: var(--ink-soft); margin-top: 0.4rem; display: none; }
  .row-card.expanded .trend-line, .needs-row.expanded .trend-line { display: block; }

  .empty-state, .error-state {
    text-align: center; padding: 2.75rem 1rem; color: var(--ink-soft);
    background: #fff; border: 1px solid var(--rule); border-radius: 6px;
  }
  .error-state .refresh-btn { margin-top: 0.9rem; }

  .bucket-header {
    font-family: var(--font-display); font-weight: 700; font-size: 1.15rem;
    margin: 1.5rem 0 0.6rem; padding-bottom: 0.4rem; border-bottom: 2px solid var(--ink);
  }
  .bucket-header:first-child { margin-top: 0; }

  .category-subheader {
    font-family: var(--font-body); font-weight: 600; font-size: 0.75rem;
    text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft);
    margin: 1rem 0 0.5rem;
  }

  .needs-row-list { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 0.2rem; }
  .needs-row {
    background: #fff; border: 1px solid var(--rule); border-radius: 6px; padding: 0.85rem 1.1rem;
  }
  .needs-row-name { font-family: var(--font-display); font-weight: 700; font-size: 0.95rem; margin-bottom: 0.5rem; }
  .trend-note { color: var(--ink-soft); font-weight: 500; font-size: 0.78rem; }

  .reason-line { color: var(--ink-soft); font-size: 0.8rem; margin-top: 0.5rem; }

  .jump-line { margin: -0.25rem 0 1rem; font-size: 0.88rem; }
  .jump-line a { color: var(--ledger-green); font-weight: 600; padding: 0.4rem 0; display: inline-block; }
  .jump-line a:focus-visible { outline: 2px solid var(--ledger-green); outline-offset: 2px; }

  .buy-group { margin-top: 1.75rem; border-top: 2px solid var(--ink); }
  .buy-group summary {
    font-family: var(--font-display); font-weight: 700; font-size: 1.15rem;
    padding: 0.85rem 0; cursor: pointer;
  }
  .buy-group summary:focus-visible { outline: 2px solid var(--ledger-green); outline-offset: 2px; }
  .buy-group-note { color: var(--ink-soft); font-size: 0.82rem; margin: 0 0 0.25rem; }
</style>
</head>
<body>
<main>
  <header>
    <a class="breadcrumb" href="/">← Operator Tools</a>
    <h1>Reorder Status</h1>
  </header>

  <div class="toolbar">
    <div class="subtitle" id="asOf">Loading…</div>
    <button class="refresh-btn" id="refreshBtn" type="button">Refresh</button>
  </div>

  <div class="view-toggle">
    <button class="view-btn" data-view="needs_attention" aria-pressed="true" type="button">Needs Attention</button>
    <button class="view-btn" data-view="category" aria-pressed="false" type="button">By Category</button>
  </div>

  <div class="jump-line" id="jumpLine" hidden><a href="#buy-as-needed" id="jumpLink"></a></div>

  <div class="filter-wrap" id="filterWrap" hidden>
    <input type="text" class="filter-input" id="categoryFilter" placeholder='Filter by name (e.g. "jerry")'>
    <button class="filter-clear" id="filterClear" type="button" aria-label="Clear filter" hidden>×</button>
  </div>

  <div class="chip-bar" id="chipBar" hidden></div>

  <div class="status-filter-bar" id="statusFilterBar" hidden>
    <button class="status-chip" data-status="critical" aria-pressed="false" type="button">Critical</button>
    <button class="status-chip" data-status="warning" aria-pressed="false" type="button">Warning</button>
    <button class="status-chip" data-status="fine" aria-pressed="false" type="button">Fine</button>
    <button class="status-chip" data-status="low_sales" aria-pressed="false" type="button">Low sales</button>
    <button class="status-chip" data-status="reorder_off" aria-pressed="false" type="button">Don't reorder</button>
  </div>

  <div class="row-list" id="rowList"></div>
</main>

<script src="/shared/config.js"></script>
<script>
(function () {
  // ---- API integration ----------------------------------------------
  // config.js (loaded above) declares the global API_KEY constant, same
  // pattern as Tax & Revenue Share Obligations and the other CRUD tools.
  var API_BASE = 'https://randysmith42.app.n8n.cloud/webhook/reorder-signal';

  var state = { rows: [], view: 'needs_attention', category: null, filterText: '', statusFilters: [], loading: false, error: null, generatedAt: null, groupOpen: false, hashHandled: false };
  var BUCKET_CAP_DAYS = 10;

  var els = {
    asOf: document.getElementById('asOf'),
    refreshBtn: document.getElementById('refreshBtn'),
    viewBtns: document.querySelectorAll('.view-btn'),
    filterWrap: document.getElementById('filterWrap'),
    filterInput: document.getElementById('categoryFilter'),
    filterClear: document.getElementById('filterClear'),
    statusFilterBar: document.getElementById('statusFilterBar'),
    chipBar: document.getElementById('chipBar'),
    rowList: document.getElementById('rowList'),
    jumpLine: document.getElementById('jumpLine'),
    jumpLink: document.getElementById('jumpLink')
  };

  function statusLabel(status) {
    switch (status) {
      case 'critical': return 'Critical';
      case 'warning': return 'Warning';
      case 'fine': return 'Fine';
      case 'low_sales': return 'Low sales';
      case 'reorder_off': return 'Don\'t reorder';
      default: return status;
    }
  }

  function formatRate(rate) {
    return (rate === null || rate === undefined) ? '—' : rate.toFixed(1) + '/day';
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  // "Oct 29" in Central time; the year shows when it is not the current year; '' when the value is unreadable.
  function formatSetDate(value) {
    var d = new Date(value);
    if (!value || isNaN(d.getTime())) return '';
    var central = { timeZone: 'America/Chicago' };
    var thisYear = new Date().toLocaleDateString('en-US', { timeZone: 'America/Chicago', year: 'numeric' });
    var opts = { timeZone: central.timeZone, month: 'short', day: 'numeric' };
    if (d.toLocaleDateString('en-US', { timeZone: 'America/Chicago', year: 'numeric' }) !== thisYear) opts.year = 'numeric';
    return d.toLocaleDateString('en-US', opts);
  }

  // Why a skipped card is not on the planned list: "Don't reorder, set Oct 29", "3 sales in 30 days", "1 sale in 30 days".
  function reasonLineHTML(row) {
    var text = '';
    if (row.status === 'reorder_off') {
      var when = formatSetDate(row.reorder_off_at);
      text = when ? 'Don\'t reorder, set ' + when : 'Don\'t reorder';
    } else if (row.status === 'low_sales') {
      var sold = row.sold_in_last_30;
      if (sold !== null && sold !== undefined && sold !== '' && isFinite(Number(sold))) {
        text = Number(sold) + (Number(sold) === 1 ? ' sale' : ' sales') + ' in 30 days';
      }
    }
    return text ? '<div class="reason-line">' + escapeHtml(text) + '</div>' : '';
  }

  function trendInfoHTML(row) {
    var hasConsumption = row.daily_rate_7d !== null || row.daily_rate_30d !== null;
    var calcLine;
    if (hasConsumption) {
      var rate7 = row.daily_rate_7d || 0;
      var rate30 = row.daily_rate_30d || 0;
      var effRate = Math.max(rate7, rate30);
      var effLabel = rate7 >= rate30 ? '7-day' : '30-day';
      calcLine = row.suggested_reorder_qty + ' units — ' + row.reorder_floor_days + 'd floor x ' +
        effRate.toFixed(3) + '/day (' + effLabel + ' rate) - ' + row.stock_at_last_run + ' in stock, rounded up';
    } else {
      calcLine = 'no sales history to calculate from';
    }
    return (
      '<button class="trend-toggle" type="button" aria-expanded="false">Recent trend</button>' +
      '<div class="trend-line">7-day rate: ' + formatRate(row.daily_rate_7d) +
        (row.sold_in_last_30 !== null ? ' · ' + row.sold_in_last_30 + ' sold in last 30 days' : '') +
        '<br>Suggested qty: ' + calcLine +
      '</div>'
    );
  }

  function rowCardHTML(row) {
    var runway = row.days_runway !== null
      ? Math.floor(row.days_runway) + 'd of ' + row.reorder_floor_days + 'd floor'
      : '—';
    return (
      '<div class="row-card" data-status="' + row.status + '">' +
        '<div class="row-top">' +
          '<div>' +
            '<div class="row-name">' + escapeHtml(row.product_name) + '</div>' +
            '<div class="row-category">' + escapeHtml(row.pick_category) + '</div>' +
          '</div>' +
          '<span class="badge" data-status="' + row.status + '"><span class="dot"></span>' + statusLabel(row.status) + '</span>' +
        '</div>' +
        reasonLineHTML(row) +
        '<div class="row-stats">' +
          '<div class="stat"><span class="stat-label">Stock</span><span class="stat-value">' + row.stock_at_last_run + '</span></div>' +
          '<div class="stat"><span class="stat-label">Runway</span><span class="stat-value">' + runway + '</span></div>' +
          '<div class="stat"><span class="stat-label">Suggested</span><span class="stat-value">' + row.suggested_reorder_qty + '</span></div>' +
          '<div class="stat"><span class="stat-label">Rate (30d)</span><span class="stat-value">' + formatRate(row.daily_rate_30d) + '</span></div>' +
        '</div>' +
        trendInfoHTML(row) +
      '</div>'
    );
  }

  function groupByCategory(rows) {
    var groupsMap = {};
    rows.forEach(function (r) {
      var cat = r.pick_category || 'Uncategorized';
      if (!groupsMap[cat]) groupsMap[cat] = [];
      groupsMap[cat].push(r);
    });
    return Object.keys(groupsMap).sort().map(function (cat) {
      return {
        category: cat,
        items: groupsMap[cat].sort(function (a, b) {
          return a.product_name.localeCompare(b.product_name) || String(a.product_id).localeCompare(String(b.product_id));
        })
      };
    });
  }

  function needsRowHTML(row) {
    var daysLeftText = row.days_left + 'd';
    if (row.days_left_from_30d_trend) {
      daysLeftText += ' <span class="trend-note">(30d trend)</span>';
    }
    return (
      '<div class="needs-row">' +
        '<div class="needs-row-name">' + escapeHtml(row.product_name) + '</div>' +
        '<div class="row-stats">' +
          '<div class="stat"><span class="stat-label">Days left</span><span class="stat-value">' + daysLeftText + '</span></div>' +
          '<div class="stat"><span class="stat-label">Suggested</span><span class="stat-value">' + row.suggested_reorder_qty + '</span></div>' +
          '<div class="stat"><span class="stat-label">Floor</span><span class="stat-value">' + row.reorder_floor_days + 'd</span></div>' +
          '<div class="stat"><span class="stat-label">Stock</span><span class="stat-value">' + row.stock_at_last_run + '</span></div>' +
          '<div class="stat"><span class="stat-label">Rate (30d)</span><span class="stat-value">' + formatRate(row.daily_rate_30d) + '</span></div>' +
        '</div>' +
        trendInfoHTML(row) +
      '</div>'
    );
  }

  function renderBucketGroups(rows) {
    return groupByCategory(rows).map(function (group) {
      return '<h3 class="category-subheader">' + escapeHtml(group.category) + '</h3>' +
        '<div class="needs-row-list">' + group.items.map(needsRowHTML).join('') + '</div>';
    }).join('');
  }

  function renderNeedsAttention() {
    var flagged = state.rows.filter(function (r) { return r.reorder_flag === true; });
    var skipped = skippedRows();
    if (!flagged.length) {
      els.rowList.innerHTML = '<div class="empty-state">Nothing to plan a trip for right now.</div>' + buyAsNeededHTML(skipped);
      wireBuyGroup();
      return;
    }

    var buckets = {};
    var unknownTiming = [];
    var overflow = [];

    flagged.forEach(function (r) {
      if (r.days_left === null || r.days_left === undefined) {
        unknownTiming.push(r);
        return;
      }
      var bucketNum = Math.max(0, Math.floor(r.days_left));
      if (bucketNum > BUCKET_CAP_DAYS) {
        overflow.push(r);
        return;
      }
      if (!buckets[bucketNum]) buckets[bucketNum] = [];
      buckets[bucketNum].push(r);
    });

    var bucketNums = Object.keys(buckets).map(Number).sort(function (a, b) { return a - b; });

    var html = '';
    bucketNums.forEach(function (num) {
      var label = num === 0 ? 'Buy today' : (num === 1 ? 'Buy in the next 1 day' : 'Buy in the next ' + num + ' days');
      html += '<h2 class="bucket-header">' + label + '</h2>' + renderBucketGroups(buckets[num]);
    });

    if (overflow.length) {
      html += '<h2 class="bucket-header">Buy in the next ' + (BUCKET_CAP_DAYS + 1) + '+ days</h2>' + renderBucketGroups(overflow);
    }

    if (unknownTiming.length) {
      html += '<h2 class="bucket-header">Timing unclear</h2>' + renderBucketGroups(unknownTiming);
    }

    els.rowList.innerHTML = html + buyAsNeededHTML(skipped);
    wireBuyGroup();
  }

  // Buy As Needed: the products the email lists in its bottom section. skip_reason is set by the calculator,
  // so the page has no membership rule of its own.
  function skippedRows() {
    return state.rows.filter(function (r) { return !!r.skip_reason; });
  }

  function buyAsNeededHTML(rows) {
    if (!rows.length) return '';
    var body = groupByCategory(rows).map(function (group) {
      return '<h3 class="category-subheader">' + escapeHtml(group.category) + '</h3>' +
        '<div class="row-list">' + group.items.map(rowCardHTML).join('') + '</div>';
    }).join('');
    return '<details class="buy-group" id="buy-as-needed"' + (state.groupOpen ? ' open' : '') + '>' +
      '<summary>Buy As Needed (' + rows.length + ')</summary>' +
      '<p class="buy-group-note">Not on the planned shopping list. Buy these on a convenient stop before they run out.</p>' +
      body +
    '</details>';
  }

  function openBuyGroup() {
    var group = document.getElementById('buy-as-needed');
    if (!group) return;
    group.open = true;
    state.groupOpen = true;
    group.scrollIntoView({ block: 'start' });
    var summary = group.querySelector('summary');
    if (summary) summary.focus();
  }

  // Keeps the group's open state across redraws, and opens it once when the page is reached by the email's link.
  function wireBuyGroup() {
    var group = document.getElementById('buy-as-needed');
    if (!group) return;
    group.addEventListener('toggle', function () { state.groupOpen = group.open; });
    if (window.location.hash === '#buy-as-needed' && !state.hashHandled) {
      state.hashHandled = true;
      openBuyGroup();
    }
  }

  function renderChips() {
    var categories = Array.from(new Set(state.rows.map(function (r) { return r.pick_category; }))).sort();
    if (!state.category || categories.indexOf(state.category) === -1) {
      state.category = categories[0] || null;
    }
    els.chipBar.innerHTML = categories.map(function (cat) {
      var active = cat === state.category;
      return '<button class="chip" data-cat="' + escapeHtml(cat) + '" aria-pressed="' + active + '" type="button">' + escapeHtml(cat) + '</button>';
    }).join('');
  }

  function render() {
    els.refreshBtn.disabled = state.loading;
    els.refreshBtn.textContent = state.loading ? 'Refreshing…' : 'Refresh';

    if (state.generatedAt) {
      els.asOf.textContent = 'As of ' + new Date(state.generatedAt).toLocaleString('en-US', { timeZone: 'America/Chicago' });
    } else if (state.loading) {
      els.asOf.textContent = 'Loading…';
    }

    // "N more to buy as needed" under the view toggle: Needs Attention only, and only when the group has members.
    var buyCount = (state.error || state.view !== 'needs_attention') ? 0 : skippedRows().length;
    els.jumpLine.hidden = buyCount === 0;
    if (buyCount) els.jumpLink.textContent = buyCount + ' more to buy as needed';

    if (state.error) {
      els.filterWrap.hidden = true;
      els.chipBar.hidden = true;
      els.statusFilterBar.hidden = true;
      els.rowList.innerHTML = '<div class="error-state">Couldn\'t load the latest numbers.<br><button class="refresh-btn" id="retryBtn" type="button">Retry</button></div>';
      document.getElementById('retryBtn').addEventListener('click', loadData);
      return;
    }

    if (state.view === 'needs_attention') {
      els.filterWrap.hidden = true;
      els.chipBar.hidden = true;
      els.statusFilterBar.hidden = true;
      renderNeedsAttention();
    } else {
      els.filterWrap.hidden = false;
      els.chipBar.hidden = false;
      els.statusFilterBar.hidden = false;
      els.filterClear.hidden = !state.filterText;
      renderChips();

      var filterText = state.filterText.trim().toLowerCase();
      var catRows = state.rows
        .filter(function (r) { return r.pick_category === state.category; })
        .filter(function (r) { return !filterText || r.product_name.toLowerCase().indexOf(filterText) !== -1; })
        .filter(function (r) { return !state.statusFilters.length || state.statusFilters.indexOf(r.status) !== -1; })
        .sort(function (a, b) { return a.product_name.localeCompare(b.product_name); });

      els.rowList.innerHTML = catRows.length
        ? catRows.map(rowCardHTML).join('')
        : '<div class="empty-state">' + (filterText || state.statusFilters.length
            ? 'No items in this category match the current filters.'
            : 'No items in this category.') + '</div>';
    }
  }

  function loadData() {
    state.loading = true;
    state.error = null;
    render();
    fetch(API_BASE, { method: 'GET', headers: { 'X-API-Key': API_KEY } })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        // The calculator used to send "not_tracked" for what is now "low_sales"; read either, so deploy order doesn't matter.
        state.rows = (data.rows || []).map(function (r) {
          if (r.status === 'not_tracked') r.status = 'low_sales';
          return r;
        });
        state.generatedAt = data.generated_at || null;
      })
      .catch(function (err) {
        state.error = err;
      })
      .finally(function () {
        state.loading = false;
        render();
      });
  }

  els.refreshBtn.addEventListener('click', loadData);

  els.jumpLink.addEventListener('click', function (e) {
    e.preventDefault();
    openBuyGroup();
  });

  els.viewBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      els.viewBtns.forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
      btn.setAttribute('aria-pressed', 'true');
      state.view = btn.dataset.view;
      render();
    });
  });

  els.filterInput.addEventListener('input', function () {
    state.filterText = els.filterInput.value;
    els.filterClear.hidden = !state.filterText;
    render();
  });

  els.filterClear.addEventListener('click', function () {
    state.filterText = '';
    els.filterInput.value = '';
    els.filterInput.focus();
    render();
  });

  els.statusFilterBar.addEventListener('click', function (e) {
    var chip = e.target.closest('.status-chip');
    if (!chip) return;
    var status = chip.dataset.status;
    var idx = state.statusFilters.indexOf(status);
    if (idx === -1) {
      state.statusFilters.push(status);
      chip.setAttribute('aria-pressed', 'true');
    } else {
      state.statusFilters.splice(idx, 1);
      chip.setAttribute('aria-pressed', 'false');
    }
    render();
  });

  els.chipBar.addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (!chip) return;
    state.category = chip.dataset.cat;
    render();
  });

  els.rowList.addEventListener('click', function (e) {
    var btn = e.target.closest('.trend-toggle');
    if (!btn) return;
    var card = btn.closest('.row-card, .needs-row');
    var expanded = card.classList.toggle('expanded');
    btn.setAttribute('aria-expanded', String(expanded));
    btn.textContent = expanded ? 'Hide recent trend' : 'Recent trend';
  });

  loadData();
})();
</script>
</body>
</html>
